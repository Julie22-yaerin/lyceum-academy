<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCLICK Admin — Training AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --card:    #1c2330;
      --border:  #30363d;
      --muted:   #8b949e;
      --text:    #e6edf3;
      --em:      #3fb950;
      --em-dim:  rgba(63,185,80,.12);
      --em-ring: rgba(63,185,80,.3);
      --blue:    #58a6ff;
      --amber:   #d29922;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter','Segoe UI',sans-serif; background:var(--bg); color:var(--text); margin:0; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:#30363d; border-radius:3px; }
    input,textarea,select { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 12px; font-size:13px; width:100%; outline:none; font-family:inherit; }
    input:focus,textarea:focus { border-color:var(--em); }
    textarea { resize:vertical; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all .15s; white-space:nowrap; }
    .btn-primary { background:var(--em); color:#0d1117; }
    .btn-primary:hover { opacity:.85; }
    .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }
    .btn-ghost:hover { color:var(--text); border-color:#58a6ff33; background:rgba(88,166,255,.06); }
    .btn-danger { background:transparent; color:#f85149; border:1px solid rgba(248,81,73,.25); }
    .btn-danger:hover { background:rgba(248,81,73,.12); }
    .nav-btn { padding:5px 12px; border-radius:7px; background:transparent; color:var(--muted); border:none; cursor:pointer; font-weight:500; transition:all .15s; }
    .nav-btn:hover { color:var(--text); background:rgba(255,255,255,.05); }
    .nav-btn.active { color:var(--text); background:rgba(88,166,255,.1); }
    .spinner { animation:spin 1s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .fade-in { animation:fadein .18s ease; }
    @keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
    #login-screen.hidden, #app.hidden { display:none!important; }
    .model-card { border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:20px; cursor:pointer; transition:all .15s; }
    .model-card:hover { border-color:var(--em-ring); background:var(--card); transform:translateY(-1px); }
    .task-card { border:1px solid var(--border); border-radius:12px; background:var(--card); margin-bottom:10px; }
    .task-header { display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer; }
    .task-header:hover { background:rgba(255,255,255,.03); border-radius:12px; }
    .task-body { padding:0 16px 16px; border-top:1px solid var(--border); }
    .example-row { border:1px solid var(--border); border-radius:8px; padding:12px; margin-top:8px; background:var(--surface); }
    .shot-label { font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
    .pill { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:9999px; font-size:11px; font-weight:500; }
    .pill-green { background:var(--em-dim); color:var(--em); border:1px solid var(--em-ring); }
    .pill-blue  { background:rgba(88,166,255,.1); color:var(--blue); border:1px solid rgba(88,166,255,.25); }
    .pill-amber { background:rgba(210,153,34,.1); color:var(--amber); border:1px solid rgba(210,153,34,.25); }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════
     LOGIN
════════════════════════════════════════════════════════════ -->
<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-4xl mb-3">🐍🐈</div>
      <h1 class="text-2xl font-bold">PCLICK Admin</h1>
      <p style="color:var(--muted)" class="text-sm mt-1">Training AI · Knowledge Base</p>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border)" class="rounded-2xl p-6 space-y-4 shadow-2xl">

      <button id="google-btn" onclick="signInWithGoogle()"
        class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-white hover:bg-gray-100 text-gray-800 font-medium rounded-xl transition-colors text-sm shadow">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <div class="flex items-center gap-3"><div class="flex-1 border-t" style="border-color:var(--border)"></div><span class="text-xs" style="color:var(--muted)">or dev token</span><div class="flex-1 border-t" style="border-color:var(--border)"></div></div>

      <div class="flex gap-2">
        <input id="dev-pw" type="password" placeholder="ADMIN_SECRET" style="flex:1"
          onkeydown="if(event.key==='Enter')signInWithDevToken()" />
        <button onclick="signInWithDevToken()" class="btn btn-ghost">Go</button>
      </div>

      <div id="login-error" class="text-red-400 text-xs hidden text-center"></div>
      <div id="login-loading" class="hidden justify-center flex">
        <svg class="spinner w-5 h-5" style="color:var(--em)" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
        </svg>
      </div>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     APP
════════════════════════════════════════════════════════════ -->
<div id="app" class="hidden min-h-screen flex flex-col">

  <!-- Header -->
  <header style="background:var(--surface);border-bottom:1px solid var(--border)" class="h-12 flex items-center px-5 gap-3 shrink-0 sticky top-0 z-40">
    <span class="text-base">🐍🐈</span>
    <span class="font-semibold text-sm">PCLICK Admin</span>
    <nav class="flex items-center gap-1 ml-4">
      <button id="nav-models" onclick="viewModels()" class="nav-btn text-xs">Training AI</button>
      <button id="nav-activity" onclick="viewActivity()" class="nav-btn text-xs">Activity Log</button>
      <button id="nav-profiles" onclick="viewProfiles()" class="nav-btn text-xs">Personalization</button>
      <button id="nav-feedback" onclick="viewFeedback()" class="nav-btn text-xs">Feedback</button>
    </nav>
    <div class="flex-1"></div>
    <img id="user-avatar" src="" alt="" class="w-6 h-6 rounded-full hidden" />
    <span id="user-name" class="text-xs hidden" style="color:var(--muted)"></span>
    <span class="w-1.5 h-1.5 rounded-full" id="api-dot" style="background:var(--border)"></span>
    <span id="header-status" class="text-xs" style="color:var(--muted)"></span>
    <button onclick="doLogout()" class="btn btn-ghost text-xs ml-2">Sign out</button>
  </header>

  <!-- Offline banner -->
  <div id="offline-banner" class="hidden px-5 py-2.5 flex items-center gap-3 text-sm shrink-0"
    style="background:#1a0a0a;border-bottom:1px solid #5c1111">
    <svg class="w-4 h-4 shrink-0 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    <span class="text-red-300 flex-1 text-xs">Backend offline — <code style="background:rgba(255,255,255,.1);padding:0 4px;border-radius:4px">start_backend.command</code> then <button onclick="retryConnect()" class="underline hover:text-white transition-colors">retry</button></span>
    <span id="retry-countdown" class="text-xs" style="color:#5c1111"></span>
  </div>

  <!-- Main -->
  <main class="flex-1 overflow-auto">
    <div id="view-models" class="hidden p-6 max-w-4xl mx-auto fade-in"></div>
    <div id="view-model-detail" class="hidden p-6 max-w-3xl mx-auto fade-in"></div>
    <div id="view-activity" class="hidden p-6 max-w-5xl mx-auto fade-in"></div>
    <div id="view-profiles" class="hidden p-6 max-w-4xl mx-auto fade-in"></div>
    <div id="view-profile-detail" class="hidden p-6 max-w-4xl mx-auto fade-in"></div>
    <div id="view-feedback" class="hidden p-6 max-w-4xl mx-auto fade-in"></div>
  </main>
</div>

<!-- ════════════════════════════════════════════════════════════
     TASK MODAL
════════════════════════════════════════════════════════════ -->
<div id="task-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(0,0,0,.7);backdrop-filter:blur(4px)">
  <div style="background:var(--surface);border:1px solid var(--border)" class="rounded-2xl w-full max-w-md shadow-2xl">
    <div class="flex items-center justify-between px-5 py-4" style="border-bottom:1px solid var(--border)">
      <h3 id="task-modal-title" class="font-semibold text-sm">Add task</h3>
      <button onclick="closeModal('task-modal')" class="text-gray-500 hover:text-white text-xl leading-none">&times;</button>
    </div>
    <div class="p-5 space-y-3">
      <input type="hidden" id="task-edit-id" />
      <div>
        <div class="text-xs mb-1.5" style="color:var(--muted)">Task name <span class="text-red-400">*</span></div>
        <input id="task-name" type="text" placeholder="e.g. Generate hint, Decompose problem, Check answer" />
      </div>
      <div>
        <div class="text-xs mb-1.5" style="color:var(--muted)">Description <span style="color:var(--muted)">(optional)</span></div>
        <input id="task-desc" type="text" placeholder="What this task does" />
      </div>
      <div id="task-error" class="text-red-400 text-xs hidden"></div>
    </div>
    <div class="px-5 pb-5 flex justify-end gap-2">
      <button onclick="closeModal('task-modal')" class="btn btn-ghost">Cancel</button>
      <button onclick="saveTask()" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<!-- EXAMPLE MODAL -->
<div id="example-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(0,0,0,.7);backdrop-filter:blur(4px)">
  <div style="background:var(--surface);border:1px solid var(--border)" class="rounded-2xl w-full max-w-xl shadow-2xl max-h-[92vh] flex flex-col">
    <div class="flex items-center justify-between px-5 py-4 shrink-0" style="border-bottom:1px solid var(--border)">
      <h3 id="example-modal-title" class="font-semibold text-sm">Add few-shot example</h3>
      <button onclick="closeModal('example-modal')" class="text-gray-500 hover:text-white text-xl leading-none">&times;</button>
    </div>
    <div class="p-5 space-y-3 overflow-y-auto flex-1">
      <input type="hidden" id="ex-id" />
      <input type="hidden" id="ex-model-id" />
      <input type="hidden" id="ex-task-id" />
      <div>
        <div class="shot-label">User message <span class="text-red-400">*</span></div>
        <textarea id="ex-user" rows="4" placeholder="What the user/student says or asks…"></textarea>
      </div>
      <div>
        <div class="shot-label">Assistant reply <span class="text-red-400">*</span></div>
        <textarea id="ex-assistant" rows="5" placeholder="The ideal AI response for fine-tuning…"></textarea>
      </div>
      <div id="ex-error" class="text-red-400 text-xs hidden"></div>
    </div>
    <div class="px-5 pb-5 flex justify-end gap-2 shrink-0" style="border-top:1px solid var(--border);padding-top:14px">
      <button onclick="closeModal('example-modal')" class="btn btn-ghost">Cancel</button>
      <button onclick="submitExample()" class="btn btn-primary">Save example</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-5 right-5 z-[100] px-4 py-2.5 rounded-xl text-sm font-medium shadow-xl fade-in"></div>

<!-- ════════════════════════════════════════════════════════════
     SCRIPT
════════════════════════════════════════════════════════════ -->
<script>
// ── Firebase ──────────────────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey:'AIzaSyAU7tndPshfmNNClBNZA3WbBBGzbmzRWI4',
  authDomain:'pclick-9f190.firebaseapp.com',
  projectId:'pclick-9f190',
  storageBucket:'pclick-9f190.firebasestorage.app',
  messagingSenderId:'43342438061',
  appId:'1:43342438061:web:2b9e5019339e6cf0e87024'
});
const auth = firebase.auth();

const API        = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:8000'
  : (location.hostname.includes('railway.app')
      ? location.origin
      : 'https://lyceum-academy-production.up.railway.app');
const COOKIE     = 'pclick_fb_token';
const DEV_TOKEN  = 'pclick-admin-dev';

let currentToken = '';
let _shown       = false;
let _pingTimer   = null;
let _retryTimer  = null;
let _retryS      = 0;
let _modelRoles  = {}; // model_id -> role, hydrated from backend (see hydrateRoles())

// ── Auth ──────────────────────────────────────────────────────────────────────
auth.onIdTokenChanged(async user => {
  setLL(false);
  if (user) {
    try { currentToken = await user.getIdToken(); } catch { currentToken = DEV_TOKEN; }
    if (!_shown) { _shown = true; showAdmin(user); }
  } else {
    await tryCookieSSO();
  }
});

async function tryCookieSSO() {
  const tok = getCookie(COOKIE);
  if (tok && await verifyToken(tok)) { currentToken = tok; _shown = true; showAdmin(null); return; }
  show('login-screen');
}

async function verifyToken(tok) {
  try { return (await fetch(API+'/admin/finetune/stats',{headers:{'X-Admin-Token':tok}})).ok; }
  catch { return false; }
}

function showAdmin(user) {
  hide('login-screen');
  document.getElementById('app').classList.remove('hidden');
  if (user?.photoURL) { const av=document.getElementById('user-avatar'); av.src=user.photoURL; av.classList.remove('hidden'); }
  const ne = document.getElementById('user-name');
  ne.textContent = user ? (user.displayName || user.email) : 'dev token';
  ne.classList.remove('hidden');
  postLoginInit();
  viewModels();
}

async function signInWithGoogle() {
  setLL(true); hide('login-error');
  try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e) { setLL(false); showLoginErr(friendlyErr(e)); }
}

async function signInWithDevToken() {
  const pw = document.getElementById('dev-pw').value.trim();
  if (!pw) { showLoginErr('Enter admin password.'); return; }
  setLL(true);
  // Dev token is static — accept immediately without backend round-trip.
  // (Backend still validates X-Admin-Token on every API call.)
  if (pw === DEV_TOKEN) { currentToken = pw; _shown = true; showAdmin(null); return; }
  // Otherwise treat as a Firebase token and verify with backend.
  if (await verifyToken(pw)) { currentToken = pw; _shown = true; showAdmin(null); }
  else { setLL(false); showLoginErr('Wrong password or backend offline.'); }
}

function friendlyErr(e) {
  const c = e.code||'';
  if (c.includes('popup-closed')) return 'Popup was closed.';
  if (c.includes('wrong-password')||c.includes('user-not-found')) return 'Wrong email or password.';
  return e.message||'Sign-in failed.';
}

function setLL(on) { document.getElementById('login-loading').classList.toggle('hidden',!on); }
function showLoginErr(m) { const e=document.getElementById('login-error'); e.textContent=m; e.classList.remove('hidden'); }

async function doLogout() {
  _shown = false; currentToken = '';
  clearInterval(_pingTimer); _pingTimer = null;
  clearInterval(_retryTimer); _retryTimer = null;
  await auth.signOut();
  document.cookie = `${COOKIE}=; path=/; max-age=0; SameSite=Strict`;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('offline-banner').classList.add('hidden');
  document.getElementById('user-avatar').classList.add('hidden');
  document.getElementById('user-name').classList.add('hidden');
  show('login-screen');
}

// ── API helpers ───────────────────────────────────────────────────────────────
function headers(extra={}) { return {'X-Admin-Token': currentToken||DEV_TOKEN, ...extra}; }

async function api(path, opts={}) {
  const r = await fetch(API+path, {...opts, headers:{...headers(), ...(opts.headers||{})}});
  if (!r.ok) { const t=await r.text().catch(()=>r.statusText); throw new Error(t||r.statusText); }
  return r;
}

function getCookie(n) {
  const m = document.cookie.split('; ').find(r=>r.startsWith(n+'='));
  return m ? decodeURIComponent(m.split('=').slice(1).join('=')) : null;
}

function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function closeModal(id) { hide(id); }

function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type==='ok' ? 'var(--em)' : '#da3633';
  el.style.color = type==='ok' ? '#0d1117' : 'white';
  el.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.add('hidden'), 3000);
}

// ── Backend ping ──────────────────────────────────────────────────────────────
async function postLoginInit() {
  setDot('yellow','connecting…');
  const ok = await pingApi();
  if (ok) { toast('✓ Backend connected'); startPing(); await hydrateRoles(); }
  else { startRetry(10); }
}

// Pull every model's persisted Role & Characteristic from the backend, and
// push up any role that so far only exists in this browser's localStorage
// (e.g. set before this backend endpoint existed) so it becomes part of
// the model's real training config instead of being stuck on one device.
async function hydrateRoles() {
  try {
    const r = await api('/admin/models/roles');
    _modelRoles = (await r.json()).roles || {};
  } catch { _modelRoles = {}; }

  for (const m of loadModels()) {
    if (_modelRoles[m.id]) continue;
    const local = localStorage.getItem(`pclick:training:role:${m.id}`) || '';
    if (local) await saveRole(m.id, local);
  }
}

async function pingApi() {
  try {
    const r = await fetch(API+'/health/live',{signal:AbortSignal.timeout(4000)});
    if (r.ok) { setDot('green','online'); hide('offline-banner'); clearRetry(); return true; }
    setDot('red','error'); show('offline-banner'); return false;
  } catch {
    setDot('red','offline'); show('offline-banner'); return false;
  }
}

function setDot(color, label) {
  const colors = {green:'var(--em)',yellow:'#d29922',red:'#f85149'};
  document.getElementById('api-dot').style.background = colors[color]||'var(--border)';
  document.getElementById('header-status').textContent = label;
}

function startPing() {
  if (_pingTimer) return;
  _pingTimer = setInterval(async()=>{
    const ok=await pingApi();
    if (ok && !document.getElementById('offline-banner').classList.contains('hidden')) {
      hide('offline-banner'); toast('✓ Backend reconnected');
    }
  }, 15000);
}

function startRetry(s=10) {
  _retryS = s; updateRetry(); clearInterval(_retryTimer);
  _retryTimer = setInterval(async()=>{
    _retryS--;
    if (_retryS<=0) { clearInterval(_retryTimer); const ok=await pingApi(); if(ok){toast('✓ Connected'); startPing();} else startRetry(15); }
    else updateRetry();
  },1000);
}
function updateRetry() { const e=document.getElementById('retry-countdown'); if(e) e.textContent=`retry in ${_retryS}s`; }
function clearRetry() { clearInterval(_retryTimer); _retryTimer=null; const e=document.getElementById('retry-countdown'); if(e)e.textContent=''; }
async function retryConnect() { clearRetry(); const ok=await pingApi(); if(ok){toast('✓ Connected'); startPing();} else startRetry(10); }

// ════════════════════════════════════════════════════════════════
// DATA STORE
// Models + tasks: localStorage
// Few-shot examples: backend finetune API (subject = modelId__taskId)
// Role per model: backend (GET/PUT /admin/models/{id}/role), cached in
//   _modelRoles + mirrored to localStorage (pclick:training:role:{modelId})
//   as an offline fallback — see hydrateRoles()/loadRole()/saveRole().
// Tasks per model: localStorage (pclick:training:tasks:{modelId})
// ════════════════════════════════════════════════════════════════

// Free / near-free models on Ollama Cloud — ollama.com/settings/keys
// Context: 128K unless noted. Tier: Level 1 = free, Level 2 = near-free.
// Mirrors backend/app/core/config.py's actual model constants — keep in
// sync when those change. modelId is the exact string sent to the provider
// API, which is also what shows up in the activity log / model_totals.
const DEFAULT_MODELS = [

// Bump this whenever DEFAULT_MODELS changes in a way that should replace
// whatever's saved in the admin's browser — old placeholder models (Qwen
// 2.5 14B, Mistral 7B, etc. that never matched any real backend model) get
// wiped and replaced rather than accumulating alongside the real list.
const MODELS_SCHEMA_VERSION = 2;

function loadModels() {
  try {
    const storedVersion = parseInt(localStorage.getItem('pclick:training:models:version') || '1', 10);
    if (storedVersion < MODELS_SCHEMA_VERSION) {
      saveModels(DEFAULT_MODELS);
      localStorage.setItem('pclick:training:models:version', String(MODELS_SCHEMA_VERSION));
      return DEFAULT_MODELS;
    }
    return JSON.parse(localStorage.getItem('pclick:training:models')) || DEFAULT_MODELS;
  } catch { return DEFAULT_MODELS; }
}
function saveModels(m) { localStorage.setItem('pclick:training:models', JSON.stringify(m)); }

function loadRole(modelId) {
  if (modelId in _modelRoles) return _modelRoles[modelId];
  return localStorage.getItem(`pclick:training:role:${modelId}`) || '';
}
async function saveRole(modelId, role) {
  _modelRoles[modelId] = role;
  localStorage.setItem(`pclick:training:role:${modelId}`, role);
  try {
    await api(`/admin/models/${encodeURIComponent(modelId)}/role`, {
      method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({role}),
    });
  } catch { toast('⚠ Role saved locally only — backend unreachable'); }
}

function loadTasks(modelId) {
  try { return JSON.parse(localStorage.getItem(`pclick:training:tasks:${modelId}`)) || []; }
  catch { return []; }
}
function saveTasks(modelId, tasks) {
  localStorage.setItem(`pclick:training:tasks:${modelId}`, JSON.stringify(tasks));
}

// ── User Types (by Symptom) — what kind of struggling student this model
// should recognize, and how it should respond to that pattern.
function loadUserTypes(modelId) {
  try { return JSON.parse(localStorage.getItem(`pclick:training:usertypes:${modelId}`)) || []; }
  catch { return []; }
}
function saveUserTypes(modelId, items) {
  localStorage.setItem(`pclick:training:usertypes:${modelId}`, JSON.stringify(items));
}

// ── Connections with other AI — how this model's task hands off to / feeds
// from another model in the pipeline (e.g. ARI -> Gemma research -> ARI).
function loadConnections(modelId) {
  try { return JSON.parse(localStorage.getItem(`pclick:training:connections:${modelId}`)) || []; }
  catch { return []; }
}
function saveConnections(modelId, items) {
  localStorage.setItem(`pclick:training:connections:${modelId}`, JSON.stringify(items));
}

// Few-shot examples stored in backend: subject = "train__{modelId}__{taskId}"
function exSubject(modelId, taskId) { return `train__${modelId}__${taskId}`; }

async function loadExamples(modelId, taskId) {
  try {
    const r = await api(`/admin/finetune/examples?subject=${encodeURIComponent(exSubject(modelId,taskId))}`);
    return await r.json();
  } catch { return []; }
}

let _activityFilter = { provider: '', task: '' };
let _activityOffset = 0;
const ACTIVITY_PAGE_SIZE = 50;

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

const PROVIDER_COLORS = {
  groq: '#FF6B35', google: '#4285F4', nvidia: '#76B900', openrouter: '#7C3AED', ollama: '#6B7280',
};

async function viewActivity() {
  hide('view-models');
  hide('view-model-detail');
  hide('view-profiles');
  hide('view-profile-detail');
  hide('view-feedback');
  setActiveNav('nav-activity');
  show('view-activity');
  _activityOffset = 0;
  await renderActivity();
}

  const el = document.getElementById('view-activity');

  const [summary, rolesResp] = await Promise.all([

    api('/admin/activity/roles').then(r => r.json()).catch(() => ({ roles: {} })),
  ]);

  const params = new URLSearchParams({ limit: ACTIVITY_PAGE_SIZE, offset: _activityOffset });
  if (_activityFilter.provider) params.set('provider', _activityFilter.provider);
  if (_activityFilter.task) params.set('task', _activityFilter.task);
  const logResp = await api('/admin/activity/log?' + params.toString()).then(r => r.json()).catch(() => ({ items: [] }));
  const items = logResp.items || [];

  const providers = [...new Set(summary.by_role.map(r => r.provider))];
  const taskOptions = Object.entries(rolesResp.roles || {});

  el.innerHTML = `
    <div class="space-y-6 fade-in">
      <div>
        <h1 class="text-xl font-bold">AI Activity Log</h1>
        <p class="text-sm mt-0.5" style="color:var(--muted)">Every AI call the backend has made this run, by role/provider/model — ${summary.total_calls} total.</p>

      <div class="grid gap-3" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">

          <div style="border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px">
            <div class="flex items-center gap-2 mb-1.5">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:${PROVIDER_COLORS[r.provider]||'#666'}"></span>
              <span class="text-xs font-medium truncate">${esc(r.role)}</span>
            </div>
            <div class="flex items-baseline gap-2">
              <span class="text-lg font-bold">${r.calls}</span>
              <span class="text-xs" style="color:var(--muted)">calls · ${(r.prompt_tokens+r.completion_tokens).toLocaleString()} tok</span>
            </div>
            <div class="text-xs mt-1" style="color:var(--muted)">${esc(r.provider)} · ${timeAgo(r.last_used)}</div>
          </div>`).join('') || `<div class="text-sm col-span-full" style="color:var(--muted)">No AI activity recorded yet.</div>`}
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <select id="activity-provider-filter" onchange="onActivityFilterChange()" class="text-xs" style="padding:6px 10px;border-radius:8px">
          <option value="">All providers</option>
          ${providers.map(p => `<option value="${esc(p)}" ${_activityFilter.provider===p?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
        <select id="activity-task-filter" onchange="onActivityFilterChange()" class="text-xs" style="padding:6px 10px;border-radius:8px">
          <option value="">All roles</option>
          ${taskOptions.map(([task,label]) => `<option value="${esc(task)}" ${_activityFilter.task===task?'selected':''}>${esc(label)}</option>`).join('')}
        </select>
        <button onclick="viewActivity()" class="btn btn-ghost text-xs">↻ Refresh</button>
      </div>

      <div style="border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden">
        <table class="w-full text-xs">
          <thead>
            <tr style="border-bottom:1px solid var(--border)">
              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">When</th>
              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">Role</th>
              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">Provider</th>
              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">Model</th>
              <th class="text-right px-4 py-2.5 font-medium" style="color:var(--muted)">Tokens</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(row => `
              <tr style="border-bottom:1px solid var(--border)">
                <td class="px-4 py-2.5" style="color:var(--muted)">${timeAgo(row.created_at)}</td>
                <td class="px-4 py-2.5">${esc(row.role)}</td>
                <td class="px-4 py-2.5">

      </div>

      <div class="flex items-center justify-between text-xs" style="color:var(--muted)">
        <button onclick="activityPage(-1)" class="btn btn-ghost text-xs" ${_activityOffset===0?'disabled':''}>← Newer</button>
        <span>Showing ${_activityOffset+1}–${_activityOffset+items.length}</span>
        <button onclick="activityPage(1)" class="btn btn-ghost text-xs" ${items.length<ACTIVITY_PAGE_SIZE?'disabled':''}>Older →</button>
      </div>
    </div>`;
}

function onActivityFilterChange() {
  _activityFilter.provider = document.getElementById('activity-provider-filter').value;
  _activityFilter.task = document.getElementById('activity-task-filter').value;
  _activityOffset = 0;
  renderActivity();
}

function activityPage(dir) {
  _activityOffset = Math.max(0, _activityOffset + dir * ACTIVITY_PAGE_SIZE);
  renderActivity();
}

// 1-20 bar, rendered as a filled horizontal track.
function bar(label, value, opts = {}) {
  const pct = Math.max(0, Math.min(100, (value / 20) * 100));
  const color = opts.color || 'var(--em)';
  return `
    <div>
      <div class="flex items-center justify-between text-xs mb-1">
        <span style="color:var(--muted)">${esc(label)}</span>
        <span class="font-mono" style="color:var(--text)">${value}<span style="color:var(--muted)">/20</span></span>
      </div>
      <div style="height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${color};border-radius:3px"></div>
      </div>
    </div>`;
}

}

let _addingModel = false;
function openAddModel() {
  if (_addingModel) return;
  _addingModel = true;
  const name = prompt('Model name (e.g. Claude 3.5 Sonnet)');

  const provider = prompt('Provider (e.g. Anthropic, OpenRouter, OpenAI)') || 'OpenRouter';

  const color = ['#4285f4','#6ee7b7','#d29922','#f85149','#bc8cff'][Math.floor(Math.random()*5)];

  viewModels();
  toast(`✓ ${name} added`);
}

async function fetchModelTotals() {
  try {

    const byModel = {};
    (resp.models || []).forEach(row => { byModel[row.model] = row; });
    _lastModelTotals = byModel;

  return _lastModelTotals;
}

function addUserType(modelId) {
  const symptom = prompt('Symptom / struggle pattern (e.g. "Cannot self-assess own progress")');
  if (!symptom) return;
  const response = prompt(`How should this model respond when it recognizes "${symptom}"?`) || '';
  const items = loadUserTypes(modelId);
  items.push({ id: 'ut-'+Date.now(), symptom, response });
  saveUserTypes(modelId, items);
  viewModelDetail(modelId);
  toast('✓ User type added');
}

function deleteUserType(modelId, id) {
  saveUserTypes(modelId, loadUserTypes(modelId).filter(u => u.id !== id));
  viewModelDetail(modelId);
}

function renderConnectionCard(modelId, conn) {
  const target = loadModels().find(m => m.id === conn.targetModelId);
  return `
    <div style="border:1px solid var(--border);border-radius:10px;background:var(--card);padding:12px 14px" class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <div class="font-medium text-sm">→ ${target ? esc(target.name) : esc(conn.targetModelId)}</div>
        ${conn.description ? `<div class="text-xs mt-1" style="color:var(--muted);white-space:pre-wrap">${esc(conn.description)}</div>` : ''}
      </div>
      <button onclick="deleteConnection('${esc(modelId)}','${esc(conn.id)}')" class="btn btn-danger text-xs shrink-0" style="padding:3px 8px">✕</button>
    </div>`;
}

function addConnection(modelId) {
  const others = loadModels().filter(m => m.id !== modelId);
  if (!others.length) { toast('No other models to connect to', 'err'); return; }
  const list = others.map((m,i) => `${i+1}. ${m.name} (${m.provider})`).join('\n');
  const choice = prompt(`Connect to which model? Enter a number:\n${list}`);
  const idx = parseInt(choice, 10) - 1;
  if (isNaN(idx) || !others[idx]) return;
  const description = prompt(`Describe the connection (e.g. "Feeds researched image/citation back into ARI's next reply")`) || '';
  const items = loadConnections(modelId);
  items.push({ id: 'conn-'+Date.now(), targetModelId: others[idx].id, description });
  saveConnections(modelId, items);
  viewModelDetail(modelId);
  toast('✓ Connection added');
}

function deleteConnection(modelId, id) {
  saveConnections(modelId, loadConnections(modelId).filter(c => c.id !== id));
  viewModelDetail(modelId);
}

async function loadAllExampleCounts(modelId, tasks) {
  for (const task of tasks) {
    const examples = await loadExamples(modelId, task.id);
    const countEl = document.getElementById('ex-count-'+task.id);
    if (countEl) {
      countEl.textContent = `${examples.length} example${examples.length!==1?'s':''}`;
      countEl.style.display = examples.length>0 ? '' : 'none';
    }
    // Cache for when the panel is opened
    task._examples = examples;
  }
}

function toggleTask(taskId) {
  const body = document.getElementById('task-body-'+taskId);
  const chev = document.getElementById('chevron-'+taskId);
  const isHidden = body.classList.contains('hidden');
  body.classList.toggle('hidden', !isHidden);
  chev.style.transform = isHidden ? 'rotate(90deg)' : '';
  if (isHidden) loadTaskExamples(_currentModelId, taskId);
}

async function loadTaskExamples(modelId, taskId) {
  const listEl = document.getElementById('ex-list-'+taskId);
  if (!listEl) return;
  listEl.innerHTML = `<div class="text-xs" style="color:var(--muted)">Loading…</div>`;
  const examples = await loadExamples(modelId, taskId);

  const countEl = document.getElementById('ex-count-'+taskId);
  if (countEl) {
    countEl.textContent = `${examples.length} example${examples.length!==1?'s':''}`;
    countEl.style.display = examples.length>0?'':'none';
  }

  if (!examples.length) {
    listEl.innerHTML = `<p class="text-xs py-2" style="color:var(--muted)">No examples yet — add a few-shot example to teach the model how to handle this task.</p>`;
    return;
  }

  listEl.innerHTML = examples.map((ex,i) => `
    <div class="example-row">
      <div class="flex items-start justify-between gap-2 mb-3">
        <span class="pill" style="background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border);font-size:10px">Example ${i+1}</span>
        <div class="flex gap-1.5">
          <button onclick="openExampleModal('${esc(modelId)}','${esc(taskId)}',${ex.id})" class="btn btn-ghost" style="font-size:11px;padding:2px 8px">Edit</button>
          <button onclick="deleteExample(${ex.id},'${esc(modelId)}','${esc(taskId)}')" class="btn btn-danger" style="font-size:11px;padding:2px 8px">✕</button>
        </div>
      </div>
      <div class="space-y-2.5">
        <div>
          <div class="shot-label">User</div>
          <div class="text-xs leading-relaxed" style="color:#c9d1d9;white-space:pre-wrap;background:var(--bg);border-radius:6px;padding:8px 10px;border:1px solid var(--border)">${esc(ex.user_message)}</div>
        </div>
        <div>
          <div class="shot-label">Assistant</div>
          <div class="text-xs leading-relaxed" style="color:#c9d1d9;white-space:pre-wrap;background:var(--bg);border-radius:6px;padding:8px 10px;border:1px solid var(--border)">${esc(ex.assistant_reply)}</div>

// ── Task CRUD ─────────────────────────────────────────────────────────────────
function openTaskModal(taskId) {
  const tasks = loadTasks(_currentModelId);
  const task  = taskId ? tasks.find(t=>t.id===taskId) : null;
  document.getElementById('task-modal-title').textContent = task ? 'Edit task' : 'Add task';
  document.getElementById('task-edit-id').value  = task?.id || '';
  document.getElementById('task-name').value     = task?.name || '';
  document.getElementById('task-desc').value     = task?.description || '';
  hide('task-error');
  show('task-modal');
  setTimeout(()=>document.getElementById('task-name').focus(), 50);
}

function saveTask() {
  const name = document.getElementById('task-name').value.trim();
  if (!name) { const e=document.getElementById('task-error'); e.textContent='Task name is required.'; e.classList.remove('hidden'); return; }
  const desc   = document.getElementById('task-desc').value.trim();
  const editId = document.getElementById('task-edit-id').value;
  const tasks  = loadTasks(_currentModelId);

  if (editId) {
    const t = tasks.find(t=>t.id===editId);
    if (t) { t.name=name; t.description=desc; }
  } else {
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+Date.now();
    tasks.push({id, name, description:desc});
  }
  saveTasks(_currentModelId, tasks);
  closeModal('task-modal');
  viewModelDetail(_currentModelId);
  toast(editId ? '✓ Task updated' : '✓ Task added');
}

function deleteTask(modelId, taskId) {
  if (!confirm('Delete this task and all its examples?')) return;
  const tasks = loadTasks(modelId).filter(t=>t.id!==taskId);
  saveTasks(modelId, tasks);
  // Delete backend examples
  api(`/admin/finetune/examples?subject=${encodeURIComponent(exSubject(modelId,taskId))}`)
    .then(r=>r.json()).then(exs=>{ exs.forEach(ex=>api('/admin/finetune/examples/'+ex.id,{method:'DELETE'}).catch(()=>{})); });
  viewModelDetail(modelId);
  toast('Task deleted');
}

function deleteModel(modelId) {
  if (!confirm('Remove this model? This will not delete examples from the backend.')) return;
  const models = loadModels().filter(m=>m.id!==modelId);
  saveModels(models);
  viewModels();
  toast('Model removed');
}

// ── Example CRUD ──────────────────────────────────────────────────────────────
function openExampleModal(modelId, taskId, exId=null) {
  document.getElementById('example-modal-title').textContent = exId ? 'Edit example' : 'Add few-shot example';
  document.getElementById('ex-id').value       = exId || '';
  document.getElementById('ex-model-id').value = modelId;
  document.getElementById('ex-task-id').value  = taskId;

  // If editing, find example
  if (exId) {
    loadExamples(modelId, taskId).then(exs => {
      const ex = exs.find(e=>e.id===exId);
      if (ex) {
        document.getElementById('ex-user').value      = ex.user_message || '';
        document.getElementById('ex-assistant').value = ex.assistant_reply || '';
      }
    });
  } else {
    document.getElementById('ex-user').value = '';
    document.getElementById('ex-assistant').value = '';
  }
  hide('ex-error');
  show('example-modal');
  setTimeout(()=>document.getElementById('ex-user').focus(), 50);
}

async function submitExample() {
  const user  = document.getElementById('ex-user').value.trim();
  const asst  = document.getElementById('ex-assistant').value.trim();
  const exId  = document.getElementById('ex-id').value;
  const mId   = document.getElementById('ex-model-id').value;
  const tId   = document.getElementById('ex-task-id').value;
  const errEl = document.getElementById('ex-error');

  if (!user || !asst) {
    errEl.textContent = 'Both User message and Assistant reply are required.';
    errEl.classList.remove('hidden'); return;
  }

  const tasks   = loadTasks(mId);
  const task    = tasks.find(t=>t.id===tId);
  const model   = loadModels().find(m=>m.id===mId);

  const body = {
    user_message:    user,
    assistant_reply: asst,
    system_prompt:   loadRole(mId),  // attach current role as system_prompt
    subject:         exSubject(mId, tId),
    tags:            [mId, tId, model?.name||mId, task?.name||tId].filter(Boolean),
  };

  try {
    if (exId) {
      await api('/admin/finetune/examples/'+exId, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      toast('✓ Example updated');
    } else {
      await api('/admin/finetune/examples', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      toast('✓ Example added');
    }
    closeModal('example-modal');
    await loadTaskExamples(mId, tId);
    // Expand task body if closed
    const body2 = document.getElementById('task-body-'+tId);
    if (body2?.classList.contains('hidden')) toggleTask(tId);
  } catch(e) {
    errEl.textContent = 'Save failed: '+e.message;
    errEl.classList.remove('hidden');
  }
}

async function deleteExample(exId, modelId, taskId) {
  if (!confirm('Delete this example?')) return;
  try {
    await api('/admin/finetune/examples/'+exId, {method:'DELETE'});
    toast('Example deleted');
    await loadTaskExamples(modelId, taskId);
  } catch(e) { toast('Delete failed: '+e.message,'err'); }
}

// ── Export JSONL for a single model ──────────────────────────────────────────
async function exportModel(modelId) {
  const tasks = loadTasks(modelId);
  const role  = loadRole(modelId);
  const lines = [];

  for (const task of tasks) {
    const exs = await loadExamples(modelId, task.id);
    for (const ex of exs) {
      lines.push(JSON.stringify({
        messages: [
          { role:'system',    content: ex.system_prompt || role || '' },
          { role:'user',      content: ex.user_message },
          { role:'assistant', content: ex.assistant_reply },
        ]
      }));
    }
  }

  if (!lines.length) { toast('No examples to export','err'); return; }
  const blob = new Blob([lines.join('\n')], {type:'application/jsonl'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `pclick_${modelId}_${new Date().toISOString().slice(0,10)}.jsonl`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`✓ Exported ${lines.length} examples`);
}

// ── OpenAI Fine-tuning ────────────────────────────────────────────────────────

const FT_STATUS_STYLE = {
  queued:    { dot:'#d29922', label:'Queued',    pill:'background:rgba(210,153,34,.12);color:#d29922;border:1px solid rgba(210,153,34,.3)' },
  running:   { dot:'#58a6ff', label:'Running',   pill:'background:rgba(88,166,255,.1);color:#58a6ff;border:1px solid rgba(88,166,255,.25)' },
  succeeded: { dot:'var(--em)', label:'Succeeded', pill:'background:rgba(63,185,80,.12);color:var(--em);border:1px solid rgba(63,185,80,.3)' },
  failed:    { dot:'#f85149', label:'Failed',    pill:'background:rgba(248,81,73,.12);color:#f85149;border:1px solid rgba(248,81,73,.25)' },
  cancelled: { dot:'var(--muted)', label:'Cancelled', pill:'background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)' },
};

let _ftPollTimers = {};

async function submitFTJob(modelId) {
  const btn = document.getElementById('ft-btn-'+modelId);
  const sel = document.getElementById('ft-base-model-'+modelId);
  if (!sel || !btn) return;
  const baseModel = sel.value;
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  try {
    const r = await api('/admin/finetune/submit-job', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ model_id: modelId, base_model: baseModel, suffix: 'pclick' }),
    });
    const job = await r.json();
    toast(`✓ Job ${job.job_id} queued`);
    await loadFTJobs(modelId);
    startFTPoll(modelId, job.job_id);
  } catch(e) {
    toast('Submit failed: '+e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 Start fine-tuning';
  }
}

async function loadFTJobs(modelId) {
  const el = document.getElementById('ft-jobs-'+modelId);
  if (!el) return;
  try {
    const r    = await api('/admin/finetune/jobs');
    const jobs = await r.json();
    if (!jobs.length) {
      el.innerHTML = `<p class="text-xs" style="color:var(--muted)">No jobs yet.</p>`;
      return;
    }
    el.innerHTML = jobs.map(j => renderJobRow(j, modelId)).join('');
    // Auto-poll any active jobs
    jobs.filter(j => j.status==='queued'||j.status==='running').forEach(j => startFTPoll(modelId, j.job_id));
  } catch(e) {
    el.innerHTML = `<p class="text-xs" style="color:#f85149">${esc(e.message)}</p>`;
  }
}

function renderJobRow(job, modelId) {
  const s   = FT_STATUS_STYLE[job.status] || FT_STATUS_STYLE.cancelled;
  const ts  = job.created_at ? new Date(job.created_at*1000).toLocaleString() : '';
  const fin = job.finished_at ? new Date(job.finished_at*1000).toLocaleString() : '';
  const active = job.status==='queued'||job.status==='running';
  return `
    <div id="ft-job-row-${esc(job.job_id)}" style="border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--card)" class="space-y-2">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full shrink-0${active?' animate-pulse':''}" style="background:${s.dot}"></span>
          <span class="text-xs font-mono" style="color:var(--muted)">${esc(job.job_id)}</span>
          <span class="pill text-xs" style="${s.pill}">${s.label}</span>
        </div>
        <div class="flex gap-1.5">
          ${active ? `<button onclick="cancelFTJob('${esc(job.job_id)}','${esc(modelId)}')" class="btn btn-danger text-xs" style="padding:2px 8px">Cancel</button>` : ''}
        </div>
      </div>
      <div class="text-xs space-y-0.5" style="color:var(--muted)">
        <div>Base: <span style="color:var(--text)">${esc(job.base_model||'')}</span></div>
        ${ts ? `<div>Started: <span style="color:var(--text)">${ts}</span></div>` : ''}
        ${fin ? `<div>Finished: <span style="color:var(--text)">${fin}</span></div>` : ''}
        ${job.trained_tokens ? `<div>Tokens trained: <span style="color:var(--text)">${job.trained_tokens.toLocaleString()}</span></div>` : ''}
        ${job.error ? `<div style="color:#f85149">Error: ${esc(job.error)}</div>` : ''}
      </div>
      ${job.fine_tuned_model ? `
        <div style="background:rgba(63,185,80,.06);border:1px solid rgba(63,185,80,.2);border-radius:8px;padding:8px 10px" class="flex items-center justify-between gap-2">
          <div>
            <div class="text-xs font-semibold" style="color:var(--em)">Fine-tuned model ID</div>
            <div class="text-xs font-mono mt-0.5" style="color:var(--text)">${esc(job.fine_tuned_model)}</div>
          </div>
          <button onclick="copyText('${esc(job.fine_tuned_model)}')" class="btn btn-ghost text-xs">Copy</button>
        </div>` : ''}
    </div>`;
}

function startFTPoll(modelId, jobId) {
  const key = modelId+'__'+jobId;
  if (_ftPollTimers[key]) return;
  _ftPollTimers[key] = setInterval(async () => {
    try {
      const r   = await api('/admin/finetune/jobs/'+jobId);
      const job = await r.json();
      const el  = document.getElementById('ft-job-row-'+jobId);
      if (el) el.outerHTML = renderJobRow(job, modelId);
      if (job.status==='succeeded'||job.status==='failed'||job.status==='cancelled') {
        clearInterval(_ftPollTimers[key]);
        delete _ftPollTimers[key];
        if (job.status==='succeeded') toast(`✓ Fine-tuning done! Model: ${job.fine_tuned_model}`);
        if (job.status==='failed')    toast('Fine-tuning failed: '+(job.error||'unknown'), 'err');
      }
    } catch {}
  }, 20000);   // poll every 20s
}

async function cancelFTJob(jobId, modelId) {
  if (!confirm('Cancel this fine-tuning job?')) return;
  try {
    await api('/admin/finetune/jobs/'+jobId, {method:'DELETE'});
    toast('Job cancelled');
    await loadFTJobs(modelId);
  } catch(e) { toast('Cancel failed: '+e.message,'err'); }
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(()=>toast('✓ Copied')).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('✓ Copied');
  });
}

// VIEW: FEEDBACK — anonymous student star rating + comments, plus an
// NVIDIA-Gemma theme breakdown of the free-text comments (backend:
// app/services/feedback.py, /admin/feedback/*).
// ════════════════════════════════════════════════════════════════

async function viewFeedback() {
  hide('view-models');
  hide('view-model-detail');
  hide('view-activity');
  hide('view-profiles');
  hide('view-profile-detail');
  setActiveNav('nav-feedback');
  show('view-feedback');
  await renderFeedback();
}

function statBar(count, max, color) {
  const pct = max > 0 ? Math.round((count / max) * 100) : 0;
  return `<div style="flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden">
    <div style="width:${pct}%;height:100%;background:${color}"></div>
  </div>`;
}

const SENTIMENT_COLORS = { positive: 'var(--em)', neutral: 'var(--amber)', negative: '#f85149' };

// Raw client submission context (page/view, user agent, client timestamp,
// etc.) — whatever the frontend sent, verbatim. Truncated preview with the
// full JSON on hover so admin can inspect without a modal.
function feedbackRawCell(raw) {
  if (!raw || (typeof raw === 'object' && Object.keys(raw).length === 0)) {
    return '<span style="color:var(--muted)">—</span>';
  }
  let obj = raw;
  if (typeof raw === 'string') {
    try { obj = JSON.parse(raw); } catch { obj = { raw }; }
  }
  const json = JSON.stringify(obj);
  const preview = json.length > 40 ? json.slice(0, 40) + '…' : json;
  return `<code title="${esc(JSON.stringify(obj, null, 2))}" style="color:var(--muted);cursor:help;font-size:10px">${esc(preview)}</code>`;
}

async function renderFeedback() {
  const el = document.getElementById('view-feedback');
  el.innerHTML = `<div class="text-sm" style="color:var(--muted)">Loading…</div>`;

  const [summary, listResp] = await Promise.all([
    api('/admin/feedback/summary').then(r => r.json()).catch(() => ({ total: 0, average: 0, distribution: {} })),
    api('/admin/feedback?limit=100').then(r => r.json()).catch(() => ({ items: [] })),
  ]);
  const items = listResp.items || [];
  const dist  = summary.distribution || {};
  const maxCount = Math.max(1, ...Object.values(dist).map(v => Number(v) || 0));

  el.innerHTML = `
    <div class="space-y-6 fade-in">
      <div>
        <h1 class="text-xl font-bold">User Feedback</h1>
        <p class="text-sm mt-0.5" style="color:var(--muted)">Anonymous star ratings + comments submitted from the workspace — ${summary.total} total, ${summary.average || 0}★ average.</p>
      </div>

      <div class="grid gap-3" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
        <div style="border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px">
          <div class="text-xs mb-1" style="color:var(--muted)">Average rating</div>
          <div class="text-2xl font-bold" style="color:var(--amber)">${summary.average || 0}★</div>
        </div>
        <div style="border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px">
          <div class="text-xs mb-1" style="color:var(--muted)">Total submissions</div>
          <div class="text-2xl font-bold">${summary.total || 0}</div>
        </div>
      </div>

      <div style="border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:16px">
        <div class="text-xs font-medium mb-3" style="color:var(--muted)">Rating distribution</div>
        <div class="space-y-2">
          ${[5, 4, 3, 2, 1].map(n => `
            <div class="flex items-center gap-3 text-xs">
              <span style="width:24px" class="text-right">${n}★</span>
              ${statBar(dist[String(n)] || 0, maxCount, 'var(--amber)')}
              <span style="width:24px;color:var(--muted)">${dist[String(n)] || 0}</span>
            </div>`).join('')}
        </div>
      </div>

      <div style="border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:16px">
        <div class="flex items-center justify-between mb-3">
          <div class="text-xs font-medium" style="color:var(--muted)">AI theme breakdown (comments)</div>
          <button onclick="loadFeedbackInsights()" class="btn btn-ghost text-xs">↻ Analyze</button>
        </div>
        <div id="feedback-insights-body" class="text-sm" style="color:var(--muted)">Click "Analyze" to cluster the written feedback into themes.</div>
      </div>

      <div style="border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden">
        <table class="w-full text-xs">
          <thead>
            <tr style="border-bottom:1px solid var(--border)">
              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">When</th>
              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">Rating</th>
              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">Comment</th>
              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">Context</th>
              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">Raw</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(r => `
              <tr style="border-bottom:1px solid var(--border)">
                <td class="px-4 py-2.5" style="color:var(--muted)">${timeAgo(r.created_at)}</td>
                <td class="px-4 py-2.5" style="color:var(--amber)">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</td>
                <td class="px-4 py-2.5">${esc(r.comment) || '<span style="color:var(--muted)">—</span>'}</td>
                <td class="px-4 py-2.5" style="color:var(--muted)">${esc(r.context) || '—'}</td>
                <td class="px-4 py-2.5">${feedbackRawCell(r.raw)}</td>
              </tr>`).join('') || `<tr><td colspan="5" class="px-4 py-8 text-center" style="color:var(--muted)">No feedback yet.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;
}

async function loadFeedbackInsights() {
  const body = document.getElementById('feedback-insights-body');
  if (!body) return;
  body.innerHTML = `<div style="color:var(--muted)">Analyzing…</div>`;
  try {
    const r = await api('/admin/feedback/insights');
    const data = await r.json();
    const themes = data.themes || [];
    const maxCount = Math.max(1, ...themes.map(t => t.count || 0));
    body.innerHTML = `
      ${data.summary ? `<p class="mb-3" style="color:var(--text)">${esc(data.summary)}</p>` : ''}
      ${themes.length ? `<div class="space-y-2">
        ${themes.map(t => `
          <div class="flex items-center gap-3 text-xs">
            <span style="width:140px" class="truncate">${esc(t.label)}</span>
            ${statBar(t.count || 0, maxCount, SENTIMENT_COLORS[t.sentiment] || 'var(--blue)')}
            <span style="width:24px;color:var(--muted)">${t.count || 0}</span>
          </div>`).join('')}
      </div>` : `<div style="color:var(--muted)">Not enough written feedback to analyze yet.</div>`}
    `;
  } catch (e) {
    body.innerHTML = `<div style="color:#f85149">Failed to analyze: ${esc(e.message)}</div>`;
  }
}
</script>

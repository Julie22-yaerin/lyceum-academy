<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCLICK Admin — AI Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --card:    #1c2330;
      --border:  #30363d;
      --muted:   #8b949e;
      --text:    #e6edf3;
      --em:      #3fb950;
      --em-dim:  rgba(63,185,80,.12);
      --em-ring: rgba(63,185,80,.3);
      --blue:    #58a6ff;
      --amber:   #d29922;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter','Segoe UI',sans-serif; background:var(--bg); color:var(--text); margin:0; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:#30363d; border-radius:3px; }
    input,textarea,select { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 12px; font-size:13px; width:100%; outline:none; font-family:inherit; }
    input:focus,textarea:focus,select:focus { border-color:var(--em); }
    textarea { resize:vertical; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all .15s; white-space:nowrap; }
    .btn-primary { background:var(--em); color:#0d1117; }
    .btn-primary:hover { opacity:.85; }
    .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }
    .btn-ghost:hover { color:var(--text); border-color:#58a6ff33; background:rgba(88,166,255,.06); }
    .btn-danger { background:transparent; color:#f85149; border:1px solid rgba(248,81,73,.25); }
    .btn-danger:hover { background:rgba(248,81,73,.12); }
    .nav-btn { padding:5px 12px; border-radius:7px; background:transparent; color:var(--muted); border:none; cursor:pointer; font-weight:500; transition:all .15s; }
    .nav-btn:hover { color:var(--text); background:rgba(255,255,255,.05); }
    .nav-btn.active { color:var(--text); background:rgba(88,166,255,.1); }
    /* Sidebar nav */
    .sn-group { font-size:9px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); padding:0 10px; margin-bottom:6px; }
    .sn-btn { display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:7px 10px; border-radius:8px;
              background:transparent; color:var(--muted); border:none; cursor:pointer; font-weight:500; font-size:12.5px;
              transition:all .15s; border-left:2px solid transparent; }
    .sn-btn span { font-size:14px; width:18px; text-align:center; }
    .sn-btn:hover { color:var(--text); background:rgba(255,255,255,.05); }
    .sn-btn.active { color:var(--text); background:rgba(88,166,255,.1); border-left-color:var(--blue,#58a6ff); }
    .spinner { animation:spin 1s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .fade-in { animation:fadein .18s ease; }
    @keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
    #login-screen.hidden, #app.hidden { display:none!important; }
    .agent-card { border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:20px; }
    .pill { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:9999px; font-size:11px; font-weight:500; }
    .pill-green { background:var(--em-dim); color:var(--em); border:1px solid var(--em-ring); }
    .pill-blue  { background:rgba(88,166,255,.1); color:var(--blue); border:1px solid rgba(88,166,255,.25); }
    .pill-amber { background:rgba(210,153,34,.1); color:var(--amber); border:1px solid rgba(210,153,34,.25); }
    .pill-red   { background:rgba(248,81,73,.1); color:#f85149; border:1px solid rgba(248,81,73,.25); }
    .chat-bubble-user { background:var(--em); color:#0d1117; border-radius:14px 14px 4px 14px; }
    .chat-bubble-ai { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:14px 14px 14px 4px; }
    .org-node { border:1px solid var(--border); border-radius:10px; background:var(--card); padding:8px 12px; display:inline-flex; align-items:center; gap:8px; }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════
     LOGIN
════════════════════════════════════════════════════════════ -->
<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <img src="/logo.png" alt="" class="w-14 h-14 object-contain mx-auto mb-3" />
      <h1 class="text-2xl font-bold">PCLICK Admin</h1>
      <p style="color:var(--muted)" class="text-sm mt-1">AI Ops · Command Center</p>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border)" class="rounded-2xl p-6 space-y-4 shadow-2xl">

      <button id="google-btn" onclick="signInWithGoogle()"
        class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-white hover:bg-gray-100 text-gray-800 font-medium rounded-xl transition-colors text-sm shadow">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <div class="flex items-center gap-3"><div class="flex-1 border-t" style="border-color:var(--border)"></div><span class="text-xs" style="color:var(--muted)">or dev token</span><div class="flex-1 border-t" style="border-color:var(--border)"></div></div>

      <div class="flex gap-2">
        <input id="dev-pw" type="password" placeholder="ADMIN_SECRET" style="flex:1"
          onkeydown="if(event.key==='Enter')signInWithDevToken()" />
        <button onclick="signInWithDevToken()" class="btn btn-ghost">Go</button>
      </div>

      <div id="login-error" class="text-red-400 text-xs hidden text-center"></div>
      <div id="login-loading" class="hidden justify-center flex">
        <svg class="spinner w-5 h-5" style="color:var(--em)" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
        </svg>
      </div>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     APP
════════════════════════════════════════════════════════════ -->
<div id="app" class="hidden min-h-screen flex flex-col">

  <!-- Header -->
  <header style="background:var(--surface);border-bottom:1px solid var(--border)" class="h-12 flex items-center px-5 gap-3 shrink-0 sticky top-0 z-40">
    <img src="/logo.png" alt="" class="w-6 h-6 object-contain" />
    <span class="font-semibold text-sm">PCLICK Admin</span>
    <div class="flex-1"></div>
    <img id="user-avatar" src="" alt="" class="w-6 h-6 rounded-full hidden" referrerpolicy="no-referrer" />
    <span id="user-name" class="text-xs hidden" style="color:var(--muted)"></span>
    <span class="w-1.5 h-1.5 rounded-full" id="api-dot" style="background:var(--border)"></span>
    <span id="header-status" class="text-xs" style="color:var(--muted)"></span>
    <button onclick="doLogout()" class="btn btn-ghost text-xs ml-2">Sign out</button>
  </header>

  <!-- Offline banner -->
  <div id="offline-banner" class="hidden px-5 py-2.5 flex items-center gap-3 text-sm shrink-0"
    style="background:#1a0a0a;border-bottom:1px solid #5c1111">
    <svg class="w-4 h-4 shrink-0 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    <span class="text-red-300 flex-1 text-xs">Backend offline — <code style="background:rgba(255,255,255,.1);padding:0 4px;border-radius:4px">start_backend.command</code> then <button onclick="retryConnect()" class="underline hover:text-white transition-colors">retry</button></span>
    <span id="retry-countdown" class="text-xs" style="color:#5c1111"></span>
  </div>

  <!-- Sidebar + Main -->
  <div class="flex-1 flex min-h-0">
  <aside class="w-52 shrink-0 overflow-y-auto py-4 px-3 flex flex-col gap-5"
    style="background:var(--surface);border-right:1px solid var(--border);position:sticky;top:48px;height:calc(100vh - 48px)">

    <!-- Nhóm 1: hành trình khách hàng, theo đúng thứ tự pipeline -->
    <div>
      <p class="sn-group">Khách hàng</p>
      <button id="nav-applications" onclick="viewApplications()" class="sn-btn"><span>📥</span>Xét duyệt</button>
      <button id="nav-meetings" onclick="viewMeetings()" class="sn-btn"><span>🤝</span>Gặp gỡ</button>
      <button id="nav-brain" onclick="viewBrain()" class="sn-btn"><span>🧠</span>Second Brain riêng</button>
      <button id="nav-workspace" onclick="viewWorkspace()" class="sn-btn"><span>🗂️</span>Workspace</button>
      <button id="nav-orders" onclick="viewOrders()" class="sn-btn"><span>📦</span>Orders</button>
      <button id="nav-profiles" onclick="viewProfiles()" class="sn-btn"><span>🎯</span>Personalization</button>
      <button id="nav-trash" onclick="viewTrash()" class="sn-btn"><span>🗑️</span>Thùng rác</button>
      <button id="nav-access-codes" onclick="viewAccessCodes()" class="sn-btn"><span>🔑</span>Mã truy cập</button>
    </div>

    <!-- Nhóm 2: chăm sóc & sự cố -->
    <div>
      <p class="sn-group">Phục vụ</p>
      <button id="nav-feedback" onclick="viewFeedback()" class="sn-btn"><span>💬</span>Feedback</button>
      <button id="nav-errors" onclick="viewErrors()" class="sn-btn"><span>🐞</span>Errors</button>
    </div>

    <!-- Nhóm 3: vận hành hệ thống AI -->
    <div>
      <p class="sn-group">Hệ thống AI</p>
      <button id="nav-ai-system" onclick="viewAiSystem()" class="sn-btn"><span>🤖</span>AI System</button>
      <button id="nav-ai-chat" onclick="viewAiChat()" class="sn-btn"><span>🗨️</span>AI Chat</button>
      <button id="nav-activity" onclick="viewActivity()" class="sn-btn"><span>📊</span>Activity Log</button>
      <button id="nav-second-brain" onclick="viewSecondBrain()" class="sn-btn"><span>🕸️</span>Second Brain chung</button>
      <button id="nav-harness" onclick="viewHarness()" class="sn-btn"><span>🧩</span>Skills / Harness</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-auto">
    <div id="view-applications" class="hidden p-6 max-w-5xl mx-auto fade-in"></div>
    <div id="view-meetings" class="hidden p-6 max-w-5xl mx-auto fade-in"></div>
    <div id="view-brain" class="hidden p-6 max-w-6xl mx-auto fade-in"></div>
    <div id="view-workspace" class="hidden p-6 max-w-7xl mx-auto fade-in"></div>
    <div id="view-trash" class="hidden p-6 max-w-5xl mx-auto fade-in"></div>
    <div id="view-access-codes" class="hidden p-6 max-w-4xl mx-auto fade-in"></div>
    <div id="view-orders" class="hidden p-6 max-w-5xl mx-auto fade-in"></div>
    <div id="view-errors" class="hidden p-6 max-w-5xl mx-auto fade-in"></div>
    <div id="view-ai-system" class="hidden p-6 max-w-5xl mx-auto fade-in"></div>
    <div id="view-ai-chat" class="hidden p-6 max-w-5xl mx-auto fade-in"></div>
    <div id="view-activity" class="hidden p-6 max-w-5xl mx-auto fade-in"></div>
    <div id="view-profiles" class="hidden p-6 max-w-4xl mx-auto fade-in"></div>
    <div id="view-profile-detail" class="hidden p-6 max-w-4xl mx-auto fade-in"></div>
    <div id="view-feedback" class="hidden p-6 max-w-4xl mx-auto fade-in"></div>
    <div id="view-second-brain" class="hidden p-6 max-w-6xl mx-auto fade-in"></div>
    <div id="view-harness" class="hidden p-6 max-w-7xl mx-auto fade-in"></div>
  </main>
  </div><!-- /sidebar+main -->
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-5 right-5 z-[100] px-4 py-2.5 rounded-xl text-sm font-medium shadow-xl fade-in"></div>

<!-- ════════════════════════════════════════════════════════════
     SCRIPT
════════════════════════════════════════════════════════════ -->
<script>
// ── Firebase ──────────────────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey:'AIzaSyAU7tndPshfmNNClBNZA3WbBBGzbmzRWI4',
  authDomain:'pclick-9f190.firebaseapp.com',
  projectId:'pclick-9f190',
  storageBucket:'pclick-9f190.firebasestorage.app',
  messagingSenderId:'43342438061',
  appId:'1:43342438061:web:2b9e5019339e6cf0e87024'
});
const auth = firebase.auth();

const API        = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:8000'
  : (location.hostname.includes('railway.app')
      ? location.origin
      : 'https://lyceum-academy-production.up.railway.app');
const COOKIE     = 'pclick_fb_token';

let currentToken = '';
let _firebaseUser = null;
let _shown       = false;
let _pingTimer   = null;
let _retryTimer  = null;
let _retryS      = 0;
let _tokenRefreshTimer = null;

// ── Auth ──────────────────────────────────────────────────────────────────────
auth.onIdTokenChanged(async user => {
  setLL(false);
  if (user) {
    _firebaseUser = user;
    // Never fall back to DEV_TOKEN here — a silent fallback lets you "in"
    // while every API call 401s (production ADMIN_SECRET differs). If the
    // ID token can't be fetched, retry once, then surface the error.
    try { currentToken = await user.getIdToken(true); }
    catch {
      try { currentToken = await user.getIdToken(); }
      catch { showLoginErr('Không lấy được Firebase ID token — thử đăng nhập lại.'); show('login-screen'); return; }
    }
    if (!_shown) { _shown = true; showAdmin(user); }
  } else {
    _firebaseUser = null;
    await tryCookieSSO();
  }
});

function startTokenRefresh() {
  if (_tokenRefreshTimer) return;
  _tokenRefreshTimer = setInterval(async () => {
    if (_firebaseUser) {
      try { currentToken = await _firebaseUser.getIdToken(true); } catch {}
    }
  }, 30 * 60 * 1000);
}

async function tryCookieSSO() {
  const tok = getCookie(COOKIE);
  if (tok && await verifyToken(tok)) { currentToken = tok; _shown = true; showAdmin(null); return; }
  show('login-screen');
}

async function verifyToken(tok) {
  try { return (await fetch(API+'/ai-registry/agents',{headers:{'X-Admin-Token':tok}})).ok; }
  catch { return false; }
}

function showAdmin(user) {
  hide('login-screen');
  document.getElementById('app').classList.remove('hidden');
  if (user?.photoURL) { const av=document.getElementById('user-avatar'); av.src=user.photoURL; av.classList.remove('hidden'); }
  const ne = document.getElementById('user-name');
  ne.textContent = user ? (user.displayName || user.email) : 'dev token';
  ne.classList.remove('hidden');
  startTokenRefresh();
  postLoginInit();
  viewApplications();
}

async function signInWithGoogle() {
  setLL(true); hide('login-error');
  try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e) { setLL(false); showLoginErr(friendlyErr(e)); }
}

async function signInWithDevToken() {
  const pw = document.getElementById('dev-pw').value.trim();
  if (!pw) { showLoginErr('Enter admin password.'); return; }
  setLL(true);
  // ALWAYS verify against the backend before entering — a client-side-only
  // accept let people "in" while every API call silently 401'd (production
  // ADMIN_SECRET differs from the dev default).
  if (await verifyToken(pw)) { currentToken = pw; _shown = true; showAdmin(null); }
  else { setLL(false); showLoginErr('Sai admin token (backend từ chối 401) hoặc backend offline. Kiểm tra ADMIN_SECRET trên Railway.'); }
}

function friendlyErr(e) {
  const c = e.code||'';
  if (c.includes('popup-closed')) return 'Popup was closed.';
  if (c.includes('wrong-password')||c.includes('user-not-found')) return 'Wrong email or password.';
  return e.message||'Sign-in failed.';
}

function setLL(on) { document.getElementById('login-loading').classList.toggle('hidden',!on); }
function showLoginErr(m) { const e=document.getElementById('login-error'); e.textContent=m; e.classList.remove('hidden'); }

async function doLogout() {
  _shown = false; currentToken = '';
  _firebaseUser = null;
  clearInterval(_pingTimer); _pingTimer = null;
  clearInterval(_retryTimer); _retryTimer = null;
  clearInterval(_tokenRefreshTimer); _tokenRefreshTimer = null;
  await auth.signOut();
  document.cookie = `${COOKIE}=; path=/; max-age=0; SameSite=Strict`;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('offline-banner').classList.add('hidden');
  document.getElementById('user-avatar').classList.add('hidden');
  document.getElementById('user-name').classList.add('hidden');
  show('login-screen');
}

// ── API helpers ───────────────────────────────────────────────────────────────
// No DEV_TOKEN fallback — sending the dev token against a prod ADMIN_SECRET
// turns every view into a silent 401. An empty token 401s loudly instead.
function headers(extra={}) { return {'X-Admin-Token': currentToken, ...extra}; }

async function api(path, opts={}) {
  let r = await fetch(API+path, {...opts, headers:{...headers(), ...(opts.headers||{})}});
  if (r.status === 401 && _firebaseUser) {
    try { currentToken = await _firebaseUser.getIdToken(true); } catch {}
    r = await fetch(API+path, {...opts, headers:{...headers(), ...(opts.headers||{})}});
  }
  if (r.status === 401 || r.status === 403) {
    // Surface auth failures loudly — silent catches made 401 look like "no data".
    toast('⚠ Backend từ chối token (' + r.status + ') — đăng nhập lại với đúng ADMIN_SECRET hoặc Google (email trong ADMIN_EMAILS).', 'err');
    throw new Error('unauthorized (' + r.status + ')');
  }
  if (!r.ok) { const t=await r.text().catch(()=>r.statusText); throw new Error(t||r.statusText); }
  return r;
}

function getCookie(n) {
  const m = document.cookie.split('; ').find(r=>r.startsWith(n+'='));
  return m ? decodeURIComponent(m.split('=').slice(1).join('=')) : null;
}

function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type==='ok' ? 'var(--em)' : '#da3633';
  el.style.color = type==='ok' ? '#0d1117' : 'white';
  el.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.add('hidden'), 3000);
}

// ── Backend ping ──────────────────────────────────────────────────────────────
async function postLoginInit() {
  setDot('yellow','connecting…');
  const ok = await pingApi();
  if (ok) { toast('✓ Backend connected'); startPing(); }
  else { startRetry(10); }
}

async function pingApi() {
  try {
    const r = await fetch(API+'/health/live',{signal:AbortSignal.timeout(4000)});
    if (r.ok) { setDot('green','online'); hide('offline-banner'); clearRetry(); return true; }
    setDot('red','error'); show('offline-banner'); return false;
  } catch {
    setDot('red','offline'); show('offline-banner'); return false;
  }
}

function setDot(color, label) {
  const colors = {green:'var(--em)',yellow:'#d29922',red:'#f85149'};
  document.getElementById('api-dot').style.background = colors[color]||'var(--border)';
  document.getElementById('header-status').textContent = label;
}

function startPing() {
  if (_pingTimer) return;
  _pingTimer = setInterval(async()=>{
    const ok=await pingApi();
    if (ok && !document.getElementById('offline-banner').classList.contains('hidden')) {
      hide('offline-banner'); toast('✓ Backend reconnected');
    }
  }, 15000);
}

function startRetry(s=10) {
  _retryS = s; updateRetry(); clearInterval(_retryTimer);
  _retryTimer = setInterval(async()=>{
    _retryS--;
    if (_retryS<=0) { clearInterval(_retryTimer); const ok=await pingApi(); if(ok){toast('✓ Connected'); startPing();} else startRetry(15); }
    else updateRetry();
  },1000);
}
function updateRetry() { const e=document.getElementById('retry-countdown'); if(e) e.textContent=`retry in ${_retryS}s`; }
function clearRetry() { clearInterval(_retryTimer); _retryTimer=null; const e=document.getElementById('retry-countdown'); if(e)e.textContent=''; }
async function retryConnect() { clearRetry(); const ok=await pingApi(); if(ok){toast('✓ Connected'); startPing();} else startRetry(10); }

function setActiveNav(id) {
  document.querySelectorAll('.nav-btn, .sn-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(id);
  if (btn) btn.classList.add('active');
}

   'view-second-brain','view-harness'].forEach(hide);
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

// ════════════════════════════════════════════════════════════════
const SB_LEVEL_COLOR = { 'IGCSE':'#3fb950', 'GCSE':'#58a6ff', 'A-Level':'#d29922', 'IB':'#f85149', 'AP':'#bc8cff' };
let _sbGraph = null;

async function renderSecondBrain() {
  const el = document.getElementById('view-second-brain');
  el.innerHTML = `<div class="text-sm" style="color:var(--muted)">Loading…</div>`;

  try {
    const r = await api('/admin/second-brain/graph');

  } catch (e) {
    el.innerHTML = `<div class="text-sm" style="color:#f85149">Failed to load: ${esc(e.message)}</div>`;

  }

  const nodes = _sbGraph.nodes || [];
  const edges = _sbGraph.edges || [];
  const legend = Object.entries(SB_LEVEL_COLOR).map(([lvl,c]) =>
    `<span class="flex items-center gap-1.5 text-xs" style="color:var(--muted)"><span style="width:9px;height:9px;border-radius:50%;background:${c};display:inline-block"></span>${esc(lvl)}</span>`
  ).join('');

  el.innerHTML = `
    <div class="space-y-4 fade-in">
      <div class="flex items-start justify-between gap-4 flex-wrap">
        <div>
          <h1 class="text-xl font-bold">Second Brain</h1>
          <p class="text-sm mt-0.5" style="color:var(--muted)">Shared curriculum vault (${nodes.length} notes, ${edges.length} links) — the knowledge base every AI agent draws on instead of re-reading raw files or searching externally.</p>
        </div>
        <button onclick="reindexSecondBrain()" id="sb-reindex-btn" class="btn btn-primary text-xs">↻ Re-index vault</button>
      </div>

      <div class="flex gap-4" style="min-height:560px">
        <div style="width:210px;flex-shrink:0" class="space-y-3">
          <input id="sb-filter" oninput="sbApplyFilter()" placeholder="Filter notes…" style="width:100%" />
          <div class="space-y-1.5 pt-1">${legend}</div>
          <div id="sb-note-detail" class="text-xs" style="color:var(--muted)">Click a node to view its content.</div>
        </div>
        <div style="flex:1;border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden">
          <svg id="sb-svg" style="width:100%;height:560px;display:block"></svg>
        </div>
      </div>
    </div>`;

  sbDrawGraph(nodes, edges);
}

function sbDrawGraph(nodes, edges) {
  const svg = d3.select('#sb-svg');
  svg.selectAll('*').remove();
  const box = document.getElementById('sb-svg').getBoundingClientRect();
  const width = box.width || 800, height = 560;

  const nodeById = new Map(nodes.map(n => [n.id, n]));
  const links = edges.filter(e => nodeById.has(e.from_id) && nodeById.has(e.to_id))
    .map(e => ({ source: e.from_id, target: e.to_id }));

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(46).strength(0.35))
    .force('charge', d3.forceManyBody().strength(-90))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collide', d3.forceCollide(10));

  const g = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.2, 4]).on('zoom', (ev) => g.attr('transform', ev.transform)));

  const link = g.append('g').attr('stroke', 'var(--border)').attr('stroke-opacity', 0.6)
    .selectAll('line').data(links).join('line');

  const node = g.append('g').selectAll('circle').data(nodes).join('circle')
    .attr('r', 6)
    .attr('fill', d => SB_LEVEL_COLOR[d.level] || '#8b949e')
    .attr('stroke', 'var(--bg)').attr('stroke-width', 1.5)
    .style('cursor', 'pointer')
    .on('click', (_, d) => sbShowNote(d.id))
    .call(d3.drag()
      .on('start', (ev,d) => { if(!ev.active) sim.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (ev,d) => { d.fx=ev.x; d.fy=ev.y; })
      .on('end', (ev,d) => { if(!ev.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  node.append('title').text(d => d.title);

  sim.on('tick', () => {
    link.attr('x1', d=>d.source.x).attr('y1', d=>d.source.y).attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
    node.attr('cx', d=>d.x).attr('cy', d=>d.y);
  });

  window._sbNodeSel = node;
}

function sbApplyFilter() {
  const q = document.getElementById('sb-filter').value.trim().toLowerCase();
  if (!window._sbNodeSel) return;
  window._sbNodeSel.attr('opacity', d => {
    if (!q) return 1;
    const hay = `${d.title} ${d.subject} ${d.code} ${d.board} ${d.level}`.toLowerCase();
    return hay.includes(q) ? 1 : 0.08;
  });
}

        <p class="text-sm mt-0.5" style="color:var(--muted)">Dùng khi hồ sơ đã được duyệt nhưng cổng đăng ký tự động không mở — cấp một mã dùng một lần, học viên nhập ở màn hình đăng ký.</p>
      </div>

      <div class="flex gap-2" style="border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px">
        <input id="ac-email" placeholder="Email (để trống = ai nhập cũng được, không khuyến khích)" class="text-xs flex-1" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px" />
        <input id="ac-note" placeholder="Ghi chú (tuỳ chọn)" class="text-xs flex-1" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px" />
        <button onclick="generateAccessCode()" class="btn text-xs shrink-0" style="background:var(--amber);color:#1a1a1a">+ Tạo mã</button>
      </div>

      ${codes.length === 0 ? `<div class="text-sm" style="color:var(--muted)">Chưa có mã nào.</div>` : `
      <div class="space-y-2">
        ${codes.map(c => `
          <div class="flex items-center justify-between gap-3 text-xs" style="border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px 14px">
            <div class="min-w-0">
              <span class="font-mono font-semibold">${esc(c.code)}</span>
              <span class="ml-2" style="color:var(--muted)">${esc(c.email || 'bất kỳ email')}${c.note ? ' · ' + esc(c.note) : ''}</span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              ${c.used_at
                ? `<span class="text-[9px] uppercase tracking-wider px-2 py-0.5 rounded-full" style="background:rgba(16,185,129,.15);color:#10b981">Đã dùng · ${esc(c.used_by)}</span>`
                : `<button onclick="copyAccessCode('${esc(c.code)}')" class="btn btn-ghost text-xs">Copy</button>
                   <button onclick="revokeAccessCode('${esc(c.code)}')" class="btn btn-ghost text-xs">Thu hồi</button>`}
            </div>
          </div>`).join('')}
      </div>`}
    </div>`;
}

async function generateAccessCode() {
  const email = document.getElementById('ac-email').value.trim();
  const note = document.getElementById('ac-note').value.trim();
  try {
    const r = await api(`/admin/access-codes`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email, note }) }).then(r => r.json());
    toast(`✓ Mã: ${r.code}`);
    renderAccessCodes();
  } catch (e) { toast('Failed: ' + e.message, 'err'); }
}

function copyAccessCode(code) {
  navigator.clipboard?.writeText(code).then(() => toast('Đã copy: ' + code)).catch(() => {});
}

async function revokeAccessCode(code) {
  try {
    await api(`/admin/access-codes/${encodeURIComponent(code)}`, { method: 'DELETE' });
    toast('Đã thu hồi mã');
    renderAccessCodes();
  } catch (e) { toast('Failed: ' + e.message, 'err'); }
}

// VIEW: PER-USER SECOND BRAIN ("Second Brain riêng") — chat WITH Opus to
// design one student's personal brain, commit notes, and curate their Tool
// Dock. Everything scoped to that user's workspace.
// ════════════════════════════════════════════════════════════════
let _brainKey = '';
const ALL_TOOLS = [
  { id:'feynman', label:'Feynman', tier:1 }, { id:'toolmap', label:'Tool Map', tier:1 },

  { id:'screen-share', label:'Share Screen with AI', tier:1 },
  { id:'exercise-cards', label:'Exercise Cards', tier:1 },
  { id:'node-map', label:'Node Mapping 3D · Lý lượng tử/Toán đa biến', tier:2 },
  { id:'tactile-friction', label:'Tactile Logic Friction · Cơ học/Hoá', tier:2 },
  { id:'shatter', label:'Axiom Destructor · Nhiệt/Điện từ', tier:2 },
  { id:'auditory-gating', label:'Auditory Gating · Toán rời rạc/Giải thuật', tier:2 },
  { id:'membrane-flow', label:'Purification Sandbox · Hoá lý', tier:2 },
  { id:'steric-snap', label:'Steric Repulsion · Hoá hữu cơ', tier:2 },
  { id:'topo-lock', label:'Topological Lock · Sinh học phân tử', tier:2 },
  { id:'time-lapse', label:'Generative Sandbox · Sinh thái/Di truyền', tier:2 },
  { id:'game-builder', label:'Game Builder (Sprite Generator)', tier:'game' },
];
let _brainTools = new Set();

async function viewBrain() {
  hideAllViews();
  setActiveNav('nav-brain');
  show('view-brain');
  await renderBrainPicker();
}

function openBrainFor(email) {
  _brainKey = email;
  viewBrain();
}

async function renderBrainPicker() {
  const el = document.getElementById('view-brain');
  el.innerHTML = `<div class="text-sm" style="color:var(--muted)">Loading…</div>`;
  const { users = [] } = await api(`/admin/brain/users`).then(r => r.json()).catch(() => ({ users: [] }));

  el.innerHTML = `
    <div class="space-y-5 fade-in">
      <div>
        <h1 class="text-xl font-bold">Second Brain riêng</h1>
        <p class="text-sm mt-0.5" style="color:var(--muted)">Chat với Opus để thiết kế bộ não riêng cho từng học viên (tự động lưu), commit ghi chú, và chọn công cụ cho họ.</p>
      </div>
      <div class="flex gap-2">
        <input id="brain-key-input" value="${esc(_brainKey)}" placeholder="Email hoặc UID của học viên"
          class="text-sm flex-1" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px" />
        <button onclick="loadBrain(document.getElementById('brain-key-input').value.trim())" class="btn text-xs" style="background:var(--amber);color:#1a1a1a">Mở workspace</button>
      </div>
      ${users.length ? `
        <div>
          <p class="text-[10px] uppercase tracking-wider mb-2" style="color:var(--muted)">Đã có brain</p>
          <div class="space-y-1.5">
            ${users.map(u => `
              <button onclick="loadBrain('${esc(u.user_key)}')" class="w-full text-left text-xs flex items-center justify-between" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px">
                <span>${esc(u.user_key)}</span>
                <span style="color:var(--muted)">${u.notes} ghi chú · ${u.chat_turns} lượt chat</span>
              </button>`).join('')}
          </div>
        </div>` : ''}
      ${_brainKey ? `<div id="brain-workspace"></div>` : ''}
    </div>`;
  if (_brainKey) loadBrain(_brainKey);
}

async function loadBrain(key) {
  if (!key) return;
  _brainKey = key;
  const host = document.getElementById('brain-workspace') || (() => {
    const d = document.createElement('div'); d.id = 'brain-workspace';
    document.getElementById('view-brain').appendChild(d); return d;
  })();
  host.innerHTML = `<div class="text-sm mt-4" style="color:var(--muted)">Loading workspace…</div>`;
  const data = await api(`/admin/brain/${encodeURIComponent(key)}`).then(r => r.json()).catch(() => ({ notes:[], chat:[], tools:[], prefs:{} }));
  _brainTools = new Set(data.tools || []);

  host.innerHTML = `
    <div class="grid gap-4 mt-4" style="grid-template-columns:1fr 1fr">
      <!-- Opus chat -->
      <div style="border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-semibold">🧠 Chat với Opus — ${esc(key)}</span>
          <span class="text-[10px]" style="color:var(--muted)">tự động lưu</span>
        </div>
        <div id="brain-chat-log" style="height:340px;overflow-y:auto;background:var(--bg);border-radius:8px;padding:10px" class="space-y-2 text-xs"></div>
        <div class="flex gap-2 mt-2">
          <textarea id="brain-chat-input" rows="2" placeholder="Mô tả buổi họp, yêu cầu Opus soạn ghi chú brain…"
            class="text-xs flex-1" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px"></textarea>
          <button onclick="sendBrainChat()" id="brain-send" class="btn text-xs" style="background:var(--amber);color:#1a1a1a">Gửi</button>
        </div>
      </div>

      <!-- Notes + tools -->
      <div class="space-y-4">
        <div style="border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px">
          <p class="text-sm font-semibold mb-2">Ghi chú trong brain</p>
          <div id="brain-notes" class="space-y-1.5 text-xs mb-3"></div>
          <input id="brain-note-title" placeholder="Tiêu đề ghi chú" class="text-xs w-full mb-1.5" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px" />
          <textarea id="brain-note-body" rows="3" placeholder="Nội dung — có thể dán từ khối NOTE: của Opus" class="text-xs w-full mb-1.5" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px"></textarea>
          <button onclick="commitBrainNote()" class="btn btn-ghost text-xs w-full">+ Thêm vào brain</button>
        </div>

        <div style="border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px">
          <p class="text-sm font-semibold mb-2">Công cụ cho học viên này</p>
          <div class="space-y-2">
            ${[
              { tier:'1', label:'Bậc 1', color:'var(--muted)', activeColor:'rgba(245,158,11,.18)' },
              { tier:'2', label:'Bậc 2 · cường độ cao', color:'#f87171', activeColor:'rgba(248,113,113,.18)' },
              { tier:'game', label:'Game', color:'#60a5fa', activeColor:'rgba(96,165,250,.18)' },
            ].map(({ tier, label, color, activeColor }) => `
              <div>
                <p class="text-[10px] uppercase tracking-wider mb-1" style="color:${color}">${label}</p>
                <div class="flex flex-wrap gap-1.5">
                  ${ALL_TOOLS.filter(t=>String(t.tier)===tier).map(t=>`
                    <button onclick="toggleBrainTool('${t.id}')" id="tool-${t.id}"
                      class="text-[11px]" style="border:1px solid var(--border);border-radius:999px;padding:4px 10px;background:${_brainTools.has(t.id)?activeColor:'transparent'};color:${_brainTools.has(t.id)?'var(--text)':'var(--muted)'}">
                      ${t.label}
                    </button>`).join('')}
                </div>
              </div>`).join('')}
          </div>
          <button onclick="saveBrainTools()" class="btn text-xs w-full mt-3" style="background:var(--amber);color:#1a1a1a">Lưu công cụ</button>
        </div>
      </div>
    </div>`;

  renderBrainChat(data.chat || []);
  renderBrainNotes(data.notes || []);
}

function renderBrainChat(chat) {
  const log = document.getElementById('brain-chat-log');
  if (!log) return;
  log.innerHTML = chat.length ? chat.map(m => `
    <div style="text-align:${m.role==='admin'?'right':'left'}">
      <span style="display:inline-block;max-width:85%;padding:6px 10px;border-radius:10px;background:${m.role==='admin'?'rgba(245,158,11,.15)':'var(--surface)'};white-space:pre-wrap">${esc(m.content)}</span>
    </div>`).join('') : `<div style="color:var(--muted)">Bắt đầu cuộc trò chuyện với Opus để dựng brain.</div>`;
  log.scrollTop = log.scrollHeight;
}

function renderBrainNotes(notes) {
  const el = document.getElementById('brain-notes');
  if (!el) return;
  el.innerHTML = notes.length ? notes.map(n => `
    <div class="flex items-center justify-between gap-2">
      <span class="truncate">🧠 ${esc(n.title)}${n.subject?` · ${esc(n.subject)}`:''} <span style="color:var(--muted)">(${esc(n.source)})</span></span>
      <button onclick="deleteBrainNote('${n.id}')" style="color:var(--muted)" class="shrink-0">✕</button>
    </div>`).join('') : `<div style="color:var(--muted)">Chưa có ghi chú nào.</div>`;
}

async function sendBrainChat() {
  const input = document.getElementById('brain-chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  const btn = document.getElementById('brain-send');
  btn.disabled = true; btn.textContent = '…';
  try {
    await api(`/admin/brain/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ user_key:_brainKey, message: msg }) });
    input.value = '';
    const data = await api(`/admin/brain/${encodeURIComponent(_brainKey)}`).then(r=>r.json());
    renderBrainChat(data.chat || []);
  } catch (e) { toast('Opus lỗi: ' + e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = 'Gửi'; }
}

async function commitBrainNote() {
  const title = document.getElementById('brain-note-title').value.trim();
  const content = document.getElementById('brain-note-body').value.trim();
  if (!content) { toast('Nhập nội dung ghi chú', 'err'); return; }
  try {
    await api(`/admin/brain/notes`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ user_key:_brainKey, title: title||'Ghi chú', content }) });
    document.getElementById('brain-note-title').value = '';
    document.getElementById('brain-note-body').value = '';
    toast('✓ Đã thêm vào brain');
    const data = await api(`/admin/brain/${encodeURIComponent(_brainKey)}`).then(r=>r.json());
    renderBrainNotes(data.notes || []);
  } catch (e) { toast('Failed: ' + e.message, 'err'); }
}

async function deleteBrainNote(id) {
  try {
    await api(`/admin/brain/notes/${id}`, { method:'DELETE' });
    const data = await api(`/admin/brain/${encodeURIComponent(_brainKey)}`).then(r=>r.json());
    renderBrainNotes(data.notes || []);
  } catch (e) { toast('Failed: ' + e.message, 'err'); }
}

function toggleBrainTool(id) {
  if (_brainTools.has(id)) _brainTools.delete(id); else _brainTools.add(id);
  const btn = document.getElementById('tool-' + id);
  const tier = String(ALL_TOOLS.find(t=>t.id===id).tier);
  const on = _brainTools.has(id);
  const activeColor = tier==='2' ? 'rgba(248,113,113,.18)' : tier==='game' ? 'rgba(96,165,250,.18)' : 'rgba(245,158,11,.18)';
  btn.style.background = on ? activeColor : 'transparent';
  btn.style.color = on ? 'var(--text)' : 'var(--muted)';
}

async function saveBrainTools() {
  try {
    await api(`/admin/brain/tools`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ user_key:_brainKey, tools: [..._brainTools] }) });
    toast('✓ Đã lưu công cụ');
  } catch (e) { toast('Failed: ' + e.message, 'err'); }
}

// VIEW: WORKSPACE — large card-grid of customers; clicking a card opens

// subjects, major, teaching-method preferences, device, ADHD/focus note).
// ════════════════════════════════════════════════════════════════
let _wsProfile = null;

async function viewWorkspace() {

const SUBJECT_TAG_FIELDS = [
  { key: 'liked_subjects', label: 'Môn thích' },
  { key: 'disliked_subjects', label: 'Môn ghét' },
  { key: 'required_subjects', label: 'Môn bắt buộc phải học' },
];

async function openWorkspaceProfile(email) {
  const host = document.getElementById('workspace-profile-host');
  if (!host) return;
  host.innerHTML = `<div class="text-sm mt-4" style="color:var(--muted)">Loading…</div>`;
  const profile = await api(`/admin/profile/${encodeURIComponent(email)}`).then(r => r.json()).catch(() => null);
  if (!profile) { host.innerHTML = `<p class="text-sm text-red-400 mt-4">Không tải được hồ sơ.</p>`; return; }
  _wsProfile = { user_key: email, ...profile };

  host.innerHTML = `
    <div class="mt-4" style="border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:20px">
      <div class="flex items-center justify-between mb-4">
        <span class="text-base font-semibold">📋 Workspace — ${esc(email)}</span>
        <button onclick="document.getElementById('workspace-profile-host').innerHTML=''" class="text-xs" style="color:var(--muted)">✕ Đóng</button>
      </div>

      <div class="grid gap-4" style="grid-template-columns:1fr 1fr">
        ${SUBJECT_TAG_FIELDS.map(f => `
          <div>
            <label class="text-[10px] uppercase tracking-wider block mb-1" style="color:var(--muted)">${f.label}</label>
            <input id="ws-${f.key}" value="${esc((_wsProfile[f.key]||[]).join(', '))}" placeholder="cách nhau bằng dấu phẩy"
              class="text-sm w-full" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px" />
          </div>`).join('')}

        <div>
          <label class="text-[10px] uppercase tracking-wider block mb-1" style="color:var(--muted)">Major</label>
          <input id="ws-major" value="${esc(_wsProfile.major||'')}" placeholder="e.g. Computer Science"
            class="text-sm w-full" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px" />
        </div>

        <div>
          <label class="text-[10px] uppercase tracking-wider block mb-1" style="color:var(--muted)">Đang học trên thiết bị</label>
          <input id="ws-device" value="${esc(_wsProfile.device||'')}" placeholder="e.g. MacBook Air M2, Windows laptop, điện thoại…"
            class="text-sm w-full" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px" />
        </div>
      </div>

      <div class="flex flex-wrap gap-4 mt-5 pt-4" style="border-top:1px solid var(--border)">
        <label class="flex items-center gap-2 text-sm cursor-pointer">
          <input type="checkbox" id="ws-agrees_top_down" ${_wsProfile.agrees_top_down ? 'checked' : ''} />
          Đồng ý chiến lược TOP DOWN
        </label>
        <label class="flex items-center gap-2 text-sm cursor-pointer">
          <input type="checkbox" id="ws-advance_to_basic" ${_wsProfile.advance_to_basic ? 'checked' : ''} />

        </label>
        <label class="flex items-center gap-2 text-sm cursor-pointer">
          <input type="checkbox" id="ws-has_adhd" ${_wsProfile.has_adhd ? 'checked' : ''} />
          Có ADHD / khó tập trung
        </label>
      </div>

      <button onclick="saveWorkspaceProfile()" class="btn text-xs mt-5" style="background:var(--amber);color:#1a1a1a">Lưu hồ sơ</button>
    </div>`;
}

async function saveWorkspaceProfile() {
  if (!_wsProfile) return;
  const splitTags = v => v.split(',').map(s => s.trim()).filter(Boolean);
  const body = {
    user_key: _wsProfile.user_key,
    liked_subjects: splitTags(document.getElementById('ws-liked_subjects').value),
    disliked_subjects: splitTags(document.getElementById('ws-disliked_subjects').value),
    required_subjects: splitTags(document.getElementById('ws-required_subjects').value),
    major: document.getElementById('ws-major').value.trim(),
    device: document.getElementById('ws-device').value.trim(),
    agrees_top_down: document.getElementById('ws-agrees_top_down').checked,
    advance_to_basic: document.getElementById('ws-advance_to_basic').checked,
    has_adhd: document.getElementById('ws-has_adhd').checked,
  };
  try {
    await api(`/admin/profile`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    toast('✓ Đã lưu hồ sơ');
  } catch (e) { toast('Failed: ' + e.message, 'err'); }
}

// ════════════════════════════════════════════════════════════════
// VIEW: ORDERS — submissions from the personal Second Brain page
// (thelyceum.site/secondbrain): documents + a study schedule (self-built
// or AI-suggested), submitted for the team to turn into a personalized

let _ordersFilter = 'pending';

async function viewOrders() {

  setActiveNav('nav-orders');
  show('view-orders');

}

function onOrdersFilterChange(v) {
  _ordersFilter = v;
  renderOrders();
}

async function renderOrders() {

  el.innerHTML = `<div class="text-sm" style="color:var(--muted)">Loading…</div>`;

  const qs = _ordersFilter ? `?status=${_ordersFilter}` : '';

  el.innerHTML = `
    <div class="space-y-6 fade-in">
      <div class="flex items-center justify-between">

              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">Assigned to</th>
              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">Reported by</th>
              <th class="text-left px-4 py-2.5 font-medium" style="color:var(--muted)">Status</th>

// ════════════════════════════════════════════════════════════════
// VIEW: AI SYSTEM — identity, live status, editable org-chart, and
// per-plan credit allotment.
// ════════════════════════════════════════════════════════════════
const CATEGORY_LABEL = { head: 'Head AI', dev: 'Dev Patrol', support: 'Learning Agent' };
const CATEGORY_PILL  = { head: 'pill-blue', dev: 'pill-amber', support: 'pill-green' };

async function viewAiSystem() {
  hideAllViews();
  setActiveNav('nav-ai-system');
  show('view-ai-system');
  await renderAiSystem();
}

function buildOrgTree(agents) {
  const byId = Object.fromEntries(agents.map(a => [a.id, a]));
  const children = {};
  const roots = [];
  agents.forEach(a => {
    if (a.parent_id && byId[a.parent_id]) {
      (children[a.parent_id] ||= []).push(a);
    } else {
      roots.push(a);
    }
  });
  function renderNode(a, depth) {
    const kids = children[a.id] || [];
    return `
      <div style="margin-left:${depth*28}px" class="my-1.5">
        <div class="org-node">
          <span class="pill text-xs ${CATEGORY_PILL[a.category]||'pill-blue'}">${esc(a.name||a.id)}</span>
        </div>
        ${kids.map(k => renderNode(k, depth+1)).join('')}
      </div>`;
  }
  return roots.map(r => renderNode(r, 0)).join('') || `<p class="text-xs" style="color:var(--muted)">No agents yet.</p>`;
}

async function renderAiSystem() {
  const el = document.getElementById('view-ai-system');
  el.innerHTML = `<div class="text-sm" style="color:var(--muted)">Loading…</div>`;

  let agents = [], plans = [];
  try {
    const [ar, pr] = await Promise.all([
      api('/ai-registry/agents').then(r => r.json()),
      api('/admin/plans').then(r => r.json()).catch(() => ({ plans: [] })),
    ]);
    agents = ar.agents || [];
    plans = pr.plans || [];
  } catch (e) {
    el.innerHTML = `<div class="text-sm" style="color:#f85149">Failed to load: ${esc(e.message)}</div>`;
    return;
  }

  el.innerHTML = `
    <div class="space-y-6 fade-in">
      <div>
        <h1 class="text-xl font-bold">AI System</h1>
        <p class="text-sm mt-0.5" style="color:var(--muted)">Identity, live status, and reporting hierarchy for every AI agent — fully editable.</p>
      </div>

      <div style="border:1px solid var(--border);border-radius:14px;background:var(--surface)" class="p-5">
        <div class="font-semibold text-sm mb-3">Power / hierarchy diagram</div>
        <div id="org-chart">${buildOrgTree(agents)}</div>
      </div>

      <div class="grid gap-3" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
        ${agents.map(a => renderAgentCard(a, agents)).join('')}
      </div>

      <div style="border:1px solid var(--border);border-radius:14px;background:var(--surface)" class="p-5 space-y-4">
        <div>
          <div class="font-semibold text-sm">Tokens per feature (per plan)</div>
          <div class="text-xs mt-0.5" style="color:var(--muted)">Admin-editable token allotment per plan, per feature (e.g. note=500, chat=2000/month). Data model only for now — not yet wired to a real Stripe payment (see backend note).</div>
        </div>
        ${plans.length === 0
          ? `<p class="text-xs" style="color:var(--muted)">No plans found — is Postgres reachable?</p>`
          : plans.map(p => `
            <div style="border-top:1px solid var(--border);padding-top:12px" class="space-y-2">
              <div class="text-xs font-medium">${esc(p.tier)} · ${esc(p.billing_cycle)}</div>
              <div id="tokens-rows-${esc(p.id)}" class="space-y-1.5"><div class="text-xs" style="color:var(--muted)">Loading…</div></div>
              <div class="flex items-center gap-2">
                <input id="new-feat-name-${esc(p.id)}" placeholder="feature name (e.g. note)" style="width:180px" />
                <input id="new-feat-tokens-${esc(p.id)}" type="number" min="0" placeholder="tokens/mo" style="width:110px" />
                <button onclick="addFeatureToken('${esc(p.id)}')" class="btn btn-ghost text-xs">+ Add</button>
              </div>
            </div>`).join('')}
      </div>
    </div>`;

  plans.forEach(p => loadPlanTokens(p.id));
}

function renderAgentCard(a, allAgents) {
  const others = allAgents.filter(x => x.id !== a.id);
  const status = a.live?.status || 'n/a';
  const statusColor = status === 'idle' ? 'var(--em)' : status === 'processing' ? 'var(--amber)' : 'var(--muted)';
  return `
    <div class="agent-card space-y-3" id="agent-card-${esc(a.id)}">
      <div class="flex items-center justify-between gap-2">
        <div>
          <div class="font-semibold text-sm">${esc(a.name || a.id)}</div>
          <div class="text-[11px] font-mono" style="color:var(--muted)">${esc(a.id)}</div>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full" style="background:${statusColor}" title="${esc(status)}"></span>
          <span class="pill text-xs ${CATEGORY_PILL[a.category]||'pill-blue'}">${esc(CATEGORY_LABEL[a.category] || a.category || '—')}</span>
        </div>
      </div>

      <textarea id="desc-${esc(a.id)}" rows="3" style="font-size:12px" placeholder="What this agent does">${esc(a.description)}</textarea>

      <div class="flex items-center gap-2">
        <span class="text-xs shrink-0" style="color:var(--muted)">Reports to</span>
        <select id="parent-${esc(a.id)}" style="font-size:12px">
          <option value="">— none —</option>
          ${others.map(o => `<option value="${esc(o.id)}" ${a.parent_id===o.id?'selected':''}>${esc(o.name||o.id)}</option>`).join('')}
        </select>
      </div>

      <textarea id="notes-${esc(a.id)}" rows="2" style="font-size:12px" placeholder="Notes">${esc(a.notes)}</textarea>

      <div>
        <div class="text-[10px] uppercase tracking-wider mb-1" style="color:var(--muted)">Standing instructions (applied to every real call)</div>
        <textarea id="instr-${esc(a.id)}" rows="2" style="font-size:12px" placeholder="e.g. Be more concise. Prioritize security over performance.">${esc(a.custom_instructions)}</textarea>
      </div>

      <div class="flex justify-end">
        <button onclick="saveAgent('${esc(a.id)}')" class="btn btn-primary text-xs">Save</button>
      </div>
    </div>`;
}

async function saveAgent(id) {
  const description = document.getElementById('desc-'+id)?.value ?? '';
  const parent_id   = document.getElementById('parent-'+id)?.value || null;
  const notes       = document.getElementById('notes-'+id)?.value ?? '';
  const custom_instructions = document.getElementById('instr-'+id)?.value ?? '';
  try {
    await api(`/ai-registry/agents/${encodeURIComponent(id)}`, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ description, parent_id, notes, custom_instructions }),
    });
    toast('✓ Saved');
    renderAiSystem();
  } catch (e) { toast('Save failed: '+e.message, 'err'); }
}

async function loadPlanTokens(planId) {
  const el = document.getElementById('tokens-rows-'+planId);
  if (!el) return;
  try {
    const r = await api(`/admin/plans/${encodeURIComponent(planId)}/tokens`);
    const tokens = (await r.json()).tokens || [];
    el.innerHTML = tokens.length === 0
      ? `<p class="text-xs" style="color:var(--muted)">No feature tokens set yet.</p>`
      : tokens.map(t => `
        <div class="flex items-center gap-2 text-xs">
          <span class="w-32 shrink-0 truncate">${esc(t.feature_name)}</span>
          <input type="number" min="0" value="${t.tokens_monthly}" id="feat-${esc(planId)}-${esc(t.feature_name)}" style="width:110px" />
          <button onclick="saveFeatureToken('${esc(planId)}','${esc(t.feature_name)}')" class="btn btn-ghost text-xs">Save</button>
          <button onclick="deleteFeatureToken('${esc(planId)}','${esc(t.feature_name)}')" class="btn btn-danger text-xs">✕</button>
        </div>`).join('');
  } catch (e) {
    el.innerHTML = `<p class="text-xs" style="color:#f85149">Failed to load</p>`;
  }
}

async function saveFeatureToken(planId, featureName) {
  const val = document.getElementById(`feat-${planId}-${featureName}`)?.value;
  if (val === '' || val == null) { toast('Enter a number first', 'err'); return; }
  try {
    await api(`/admin/plans/${encodeURIComponent(planId)}/tokens/${encodeURIComponent(featureName)}`, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ tokens_monthly: parseInt(val, 10) }),
    });
    toast('✓ Saved');
  } catch (e) { toast('Save failed: '+e.message, 'err'); }
}

async function deleteFeatureToken(planId, featureName) {
  try {
    await api(`/admin/plans/${encodeURIComponent(planId)}/tokens/${encodeURIComponent(featureName)}`, { method: 'DELETE' });
    toast('Deleted');
    loadPlanTokens(planId);
  } catch (e) { toast('Delete failed: '+e.message, 'err'); }
}

async function addFeatureToken(planId) {
  const nameEl = document.getElementById('new-feat-name-'+planId);
  const tokEl = document.getElementById('new-feat-tokens-'+planId);
  const name = nameEl?.value.trim();
  const tok = tokEl?.value;
  if (!name || tok === '' || tok == null) { toast('Enter a feature name and token count', 'err'); return; }
  try {
    await api(`/admin/plans/${encodeURIComponent(planId)}/tokens/${encodeURIComponent(name)}`, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ tokens_monthly: parseInt(tok, 10) }),
    });
    nameEl.value = ''; tokEl.value = '';
    toast('✓ Added');
    loadPlanTokens(planId);
  } catch (e) { toast('Add failed: '+e.message, 'err'); }
}

// ════════════════════════════════════════════════════════════════
// VIEW: AI CHAT — talk directly to the head AIs. Per-agent session
// history kept client-side for the life of this browser tab.
// ════════════════════════════════════════════════════════════════
const HEAD_AGENTS = [
  { id: 'commander',      name: 'Commander',           endpoint: '/ai-registry/chat/commander' },
  { id: 'critique-pos1',  name: 'Critic 1 (OpenAI)',    endpoint: '/ai-registry/chat/critique-pos1' },
  { id: 'critique-pos2',  name: 'Critic 2 (Groq)',      endpoint: '/ai-registry/chat/critique-pos2' },
  { id: 'critique-pos3',  name: 'Critic 3 (Gemini)',    endpoint: '/ai-registry/chat/critique-pos3' },
  { id: 'support-chat',   name: 'Support Consultant',   endpoint: '/support/chat' },
];

let _aiChatActive = 'commander';
const _aiChatHistory  = {};   // agentId -> [{role, text}], auto-saved server-side
const _aiChatLoaded   = {};   // agentId -> true once persisted history has been fetched
const _AGENTS_WITH_HISTORY = new Set(['commander', 'critique-pos1', 'critique-pos2', 'critique-pos3']);

// One durable thread per agent (not per browser tab) — matches the backend's
// auto-save-per-agent model, so reopening the panel picks up where it left off.
function _aiChatSessionId(agentId) {
  return 'admin-' + agentId;
}

async function _ensureChatHistoryLoaded(agentId) {
  if (_aiChatLoaded[agentId] || !_AGENTS_WITH_HISTORY.has(agentId)) return;
  _aiChatLoaded[agentId] = true;
  try {
    const r = await api(`/ai-registry/chat/${encodeURIComponent(agentId)}/history`);
    const messages = (await r.json()).messages || [];
    _aiChatHistory[agentId] = messages.map(m => ({ role: m.role, text: m.content }));
  } catch (e) {
    _aiChatLoaded[agentId] = false; // allow retry next time
  }
}

async function viewAiChat() {
  hideAllViews();
  setActiveNav('nav-ai-chat');
  show('view-ai-chat');
  await _ensureChatHistoryLoaded(_aiChatActive);
  renderAiChat();
}

function renderAiChat() {
  const el = document.getElementById('view-ai-chat');
  const history = _aiChatHistory[_aiChatActive] || [];

  el.innerHTML = `
    <div class="fade-in flex gap-4" style="height:calc(100vh - 140px)">
      <div style="width:220px" class="shrink-0 space-y-1">
        ${HEAD_AGENTS.map(a => `
          <button onclick="selectAiChatAgent('${a.id}')"
            class="w-full text-left text-xs px-3 py-2.5 rounded-lg transition-colors"
            style="background:${_aiChatActive===a.id?'rgba(88,166,255,.1)':'transparent'};color:${_aiChatActive===a.id?'var(--text)':'var(--muted)'}">
            ${esc(a.name)}
          </button>`).join('')}
      </div>
      <div class="flex-1 flex flex-col" style="border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden">
        <div id="ai-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
          ${history.length === 0
            ? `<p class="text-xs text-center py-8" style="color:var(--muted)">Say hi to ${esc(HEAD_AGENTS.find(a=>a.id===_aiChatActive)?.name||'')}.</p>`
            : history.map(m => m.role === 'tool'
              ? `<div class="flex justify-start"><div class="text-[10px] font-mono px-2.5 py-1.5 rounded-lg" style="background:rgba(255,255,255,.04);color:var(--muted);border:1px dashed var(--border)">${esc(m.text)}</div></div>`
              : `<div class="flex ${m.role==='user'?'justify-end':'justify-start'}">
                <div class="max-w-[75%] px-3.5 py-2 text-xs ${m.role==='user'?'chat-bubble-user':'chat-bubble-ai'}">${esc(m.text)}</div>
              </div>`).join('')}
        </div>
        <div class="border-t p-3 flex gap-2" style="border-color:var(--border)">
          <input id="ai-chat-input" type="text" placeholder="Message…" onkeydown="if(event.key==='Enter')sendAiChat()" />
          <button onclick="sendAiChat()" class="btn btn-primary text-xs shrink-0">Send</button>
        </div>
      </div>
    </div>`;

  const box = document.getElementById('ai-chat-messages');
  if (box) box.scrollTop = box.scrollHeight;
}

async function selectAiChatAgent(id) {
  _aiChatActive = id;
  renderAiChat();
  await _ensureChatHistoryLoaded(id);
  if (_aiChatActive === id) renderAiChat();
}

async function sendAiChat() {
  const input = document.getElementById('ai-chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const agent = HEAD_AGENTS.find(a => a.id === _aiChatActive);
  const history = (_aiChatHistory[_aiChatActive] ||= []);
  history.push({ role: 'user', text });
  renderAiChat();

  try {
    const body = { session_id: _aiChatSessionId(agent.id), message: text };
    const r = await api(agent.endpoint, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body),
    });
    const data = await r.json();
    for (const tc of (data.tool_calls || [])) {
      history.push({ role: 'tool', text: `→ ran ${tc.name}(${JSON.stringify(tc.args)})` });
    }
    history.push({ role: 'assistant', text: data.reply || '(no response)' });
  } catch (e) {
    history.push({ role: 'assistant', text: 'Error: ' + e.message });
  }
  renderAiChat();
}

                <td class="px-4 py-2.5">${esc(r.comment) || '<span style="color:var(--muted)">—</span>'}</td>
                <td class="px-4 py-2.5" style="color:var(--muted)">${esc(r.context) || '—'}</td>
              </tr>`).join('') || `<tr><td colspan="4" class="px-4 py-8 text-center" style="color:var(--muted)">No feedback yet.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;
}

async function loadFeedbackInsights() {
  const body = document.getElementById('feedback-insights-body');
  if (!body) return;
  body.innerHTML = `<div style="color:var(--muted)">Analyzing…</div>`;
  try {
    const r = await api('/admin/feedback/insights');
    const data = await r.json();
    const themes = data.themes || [];
    const maxCount = Math.max(1, ...themes.map(t => t.count || 0));
    body.innerHTML = `
      ${data.summary ? `<p class="mb-3" style="color:var(--text)">${esc(data.summary)}</p>` : ''}
      ${themes.length ? `<div class="space-y-2">
        ${themes.map(t => `
          <div class="flex items-center gap-3 text-xs">
            <span style="width:140px" class="truncate">${esc(t.label)}</span>
            ${statBar(t.count || 0, maxCount, SENTIMENT_COLORS[t.sentiment] || 'var(--blue)')}
            <span style="width:24px;color:var(--muted)">${t.count || 0}</span>
          </div>`).join('')}
      </div>` : `<div style="color:var(--muted)">Not enough written feedback to analyze yet.</div>`}
    `;
  } catch (e) {
    body.innerHTML = `<div style="color:#f85149">Failed to analyze: ${esc(e.message)}</div>`;
  }
}

// ════════════════════════════════════════════════════════════════
// VIEW: SKILLS / HARNESS — the lyceum-harness/ and lyceum-orchestrator/
// B2B packages, opened and edited straight from the admin console. The
// backend re-validates every path against the two allowed roots, so this
// UI never has more reach than /admin/harness/* actually grants.
// ════════════════════════════════════════════════════════════════
let _harnessTree = null;
let _harnessCurrentPath = null;
let _harnessDirty = false;

async function viewHarness() {
  hideAllViews();
  setActiveNav('nav-harness');
  show('view-harness');
  const el = document.getElementById('view-harness');
  el.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <div>
        <h1 class="text-xl font-bold">Skills / Harness</h1>
        <p class="text-sm mt-0.5" style="color:var(--muted)">lyceum-harness/ &amp; lyceum-orchestrator/ — the B2B skill packages, editable in place.</p>
      </div>
      <button onclick="viewHarness()" class="btn btn-ghost text-xs">↻ Refresh</button>
    </div>
    <div class="flex gap-4" style="height:calc(100vh - 170px)">
      <div style="width:280px;flex:none;overflow-y:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)" class="p-2">
        <div id="harness-tree" class="text-sm">Loading…</div>
      </div>
      <div class="flex-1 flex flex-col min-w-0" style="border:1px solid var(--border);border-radius:12px;background:var(--surface)">
        <div id="harness-editor-empty" class="flex-1 flex items-center justify-center text-sm" style="color:var(--muted)">Select a file to open it.</div>
        <div id="harness-editor" class="hidden flex-1 flex flex-col min-h-0">
          <div class="flex items-center justify-between px-4 py-2" style="border-bottom:1px solid var(--border)">
            <code id="harness-editor-path" class="text-xs" style="color:var(--muted)"></code>
            <div class="flex items-center gap-2">
              <span id="harness-dirty" class="text-xs hidden" style="color:var(--amber)">unsaved</span>
              <button onclick="saveHarnessFile()" class="btn btn-primary text-xs">Save</button>
            </div>
          </div>
          <textarea id="harness-editor-content" spellcheck="false"
            style="flex:1;border:none;border-radius:0;resize:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.6;white-space:pre"
            oninput="_harnessDirty = true; document.getElementById('harness-dirty').classList.remove('hidden')"></textarea>
        </div>
      </div>
    </div>`;
  loadHarnessTree();
}

async function loadHarnessTree() {
  const box = document.getElementById('harness-tree');
  try {
    const r = await api('/admin/harness/tree');
    _harnessTree = await r.json();
    box.innerHTML = _harnessTree.map(n => harnessNodeHtml(n, 0)).join('');
  } catch (e) {
    box.innerHTML = `<div style="color:#f85149">Failed to load: ${esc(e.message)}</div>`;
  }
}

function harnessNodeHtml(node, depth) {
  const pad = 8 + depth * 14;
  if (node.is_dir) {
    const children = (node.children || []).map(c => harnessNodeHtml(c, depth + 1)).join('');
    return `<div>
      <div style="padding-left:${pad}px" class="py-1 font-medium" style="color:var(--muted)">📁 ${esc(node.name)}</div>
      ${children}
    </div>`;
  }
  return `<button onclick="openHarnessFile('${esc(node.path)}')" id="harness-node-${esc(node.path)}"
    class="w-full text-left py-1 rounded hover:bg-white/5 truncate" style="padding-left:${pad}px">📄 ${esc(node.name)}</button>`;
}

async function openHarnessFile(path) {
  if (_harnessDirty && !confirm('Discard unsaved changes?')) return;
  try {
    const r = await api('/admin/harness/file?path=' + encodeURIComponent(path));
    const data = await r.json();
    _harnessCurrentPath = path;
    _harnessDirty = false;
    document.querySelectorAll('[id^="harness-node-"]').forEach(b => b.classList.remove('bg-white/10'));
    const active = document.getElementById('harness-node-' + path);
    if (active) active.classList.add('bg-white/10');
    document.getElementById('harness-editor-path').textContent = path;
    document.getElementById('harness-editor-content').value = data.content;
    document.getElementById('harness-dirty').classList.add('hidden');
    hide('harness-editor-empty');
    show('harness-editor');
  } catch (e) {
    toast('Failed to open: ' + e.message, 'err');
  }
}

async function saveHarnessFile() {
  if (!_harnessCurrentPath) return;
  const content = document.getElementById('harness-editor-content').value;
  try {
    await api('/admin/harness/file', {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ path: _harnessCurrentPath, content }),
    });
    _harnessDirty = false;
    document.getElementById('harness-dirty').classList.add('hidden');
    toast('✓ Saved ' + _harnessCurrentPath);
  } catch (e) {
    toast('Save failed: ' + e.message, 'err');
  }
}
</script>
</body>

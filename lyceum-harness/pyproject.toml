[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyceum-harness"
version = "1.0.0"
description = "STEM deconstruction engines (Feynman + Reverse Building) behind a strict JSON contract. Bring your own LLM key."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "The Lyceum" }]
keywords = ["llm", "edtech", "stem", "feynman", "prompt-engineering", "harness"]

dependencies = [
    "httpx>=0.25",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# The FastAPI wrapper is optional: clients embedding the library in their own
# Python backend do not need a web server.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
]

[tool.setuptools.packages.find]
include = ["lyceum_harness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

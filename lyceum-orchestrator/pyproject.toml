[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyceum-stem-orchestrator"
version = "1.0.0"
description = "STEM Learning Orchestrator: a pedagogical agent that classifies learner intent and chains skill plug-ins. Strict JSON out, bring your own LLM key."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "The Lyceum" }]
keywords = ["llm", "edtech", "stem", "orchestrator", "agent", "harness", "byok"]

dependencies = ["httpx>=0.25", "pydantic>=2.5"]

[project.optional-dependencies]
# The FastAPI server is optional: clients embedding the library in their own
# Python backend do not need a web server.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "respx>=0.20"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

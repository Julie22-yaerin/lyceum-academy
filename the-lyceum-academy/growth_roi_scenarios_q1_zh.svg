<svg viewBox="0 0 1600 950" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="950" fill="#12142A"/>

  <text x="60" y="42" class="sans" font-size="14" letter-spacing="3" fill="#A78BFA">THE LYCEUM ACADEMY</text>
  <text x="60" y="82" class="serif" font-size="28" font-weight="700" fill="#F5F6FA">第一季度增长情景与投资回报率</text>
  <text x="60" y="106" class="sans" font-size="14" fill="#9CA3C4">假设:初始资金1000万越南盾 · 全部用户注册Scholar套餐 · 每月访问量60人次</text>

  <text x="60" y="165" class="sans" font-size="20" font-weight="700" fill="#F5F6FA">月度收入 — 三种情景</text>

  <rect x="100" y="188" width="16" height="16" rx="3" fill="#5EEAD4"/>
  <text x="122" y="201" class="sans" font-size="14" fill="#F5F6FA">Low(低,转化率10%)</text>
  <rect x="330" y="188" width="16" height="16" rx="3" fill="#8B5CF6"/>
  <text x="352" y="201" class="sans" font-size="14" fill="#F5F6FA">Base(基准,转化率15%)</text>
  <rect x="570" y="188" width="16" height="16" rx="3" fill="#F5B942"/>
  <text x="592" y="201" class="sans" font-size="14" fill="#F5F6FA">High(高,转化率20%)</text>

